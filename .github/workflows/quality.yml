name: Quality Gate

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python 3.12 lint and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify dependency lock contract
        run: python scripts/verify_dependency_locks.py

      - name: Verify database connection budget
        run: python scripts/verify_database_connection_budget.py

      - name: Install test and lint dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements/ci-py312-linux-x86_64.lock

      - name: Ruff
        run: python -m ruff check .

      - name: Unit tests with warning budget
        run: >-
          python -m pytest tests/unit/ -x -q
          -p no:cacheprovider
          --strict-markers
          -W error
          -W 'ignore:The default datetime adapter is deprecated as of Python 3.12:DeprecationWarning'
