<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AATS 控制台登录</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-copy">
        <p class="eyebrow">AI 参与式自主交易系统</p>
        <h1>登录交易控制台</h1>
        <p class="lead">
          使用只读、操作员或管理员账号登录。登录后可查看当前能否交易、策略判断、委托进展、盈亏变化，以及人工干预入口。
        </p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="loginUsername" class="field-label">用户名</label>
        <input id="loginUsername" type="text" autocomplete="username" placeholder="请输入账号用户名" required>

        <label for="loginPassword" class="field-label">密码</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required>

        <button id="loginButton" type="submit" class="primary-button login-button">登录</button>
      </form>

      <div id="loginMessage" class="notice-card tone-info">请输入账号和密码后继续。</div>
    </section>
  </main>

  <script type="module" charset="utf-8" src="/ui/login.js"></script>
</body>
</html>
