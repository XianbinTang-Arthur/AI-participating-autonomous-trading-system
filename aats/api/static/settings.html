<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AATS 自动交易控制台 | 策略档位、账户与权限</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body data-view="admin">
  <div class="console-shell console-shell--compact">
    <header class="utility-bar">
      <div class="utility-bar__brand">
        <p class="eyebrow">AATS 自动交易监控台</p>
        <h1>账户与权限</h1>
      </div>
      <div class="utility-bar__meta">
        <div class="session-inline">
          <strong id="sessionIdentityValue">未登录</strong>
          <span id="sessionRoleValue" class="meta-copy">当前身份：未登录</span>
          <span id="authStateChip" class="status-pill tone-neutral">未登录</span>
        </div>
        <div class="session-actions">
          <span id="lastRefreshLabel" class="meta-copy">尚未刷新</span>
          <button id="logoutButton" class="ghost-button">退出登录</button>
        </div>
      </div>
    </header>

    <nav class="workspace-nav" aria-label="主导航">
      <a class="workspace-link" href="/ui">主页</a>
      <a class="workspace-link" href="/ui/overview">交易总览</a>
      <a class="workspace-link" href="/ui/strategy">策略判断</a>
      <a class="workspace-link" href="/ui/execution">委托与成交</a>
      <a class="workspace-link" href="/ui/risk">风险与恢复</a>
      <a class="workspace-link" href="/ui/ai">AI 工作台</a>
      <a class="workspace-link is-active" href="/ui/settings">账户与权限</a>
    </nav>

    <section id="bannerContainer" class="banner-stack" aria-live="polite"></section>

    <main class="workspace">
      <section class="workspace-view is-active" data-view="admin">
        <div class="page-head">
          <div>
            <p class="panel-kicker">控制面</p>
            <h2>策略档位、账户与权限</h2>
          </div>
          <p class="page-copy">重点看当前档位、AI 最近建议、待审批档位、最近切换记录，以及控制台账号权限。</p>
        </div>
        <div id="adminContent" class="view-layout"></div>
      </section>
    </main>
  </div>

  <aside id="detailDrawer" class="detail-drawer" aria-hidden="true">
    <div class="detail-drawer__panel">
      <header class="detail-drawer__head">
        <div>
          <p id="drawerEyebrow" class="panel-kicker">详情</p>
          <h2 id="drawerTitle">明细面板</h2>
          <p id="drawerSummary" class="meta-copy">点击任意记录查看更完整的控制台明细。</p>
        </div>
        <button id="closeDrawerButton" class="ghost-button">关闭</button>
      </header>
      <div id="drawerBody" class="detail-drawer__body"></div>
    </div>
  </aside>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <script type="module" charset="utf-8" src="/ui/app.js"></script>
</body>
</html>
