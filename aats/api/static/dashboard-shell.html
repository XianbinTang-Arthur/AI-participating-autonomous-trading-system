<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AATS 自动交易监控台</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body data-view="home">
  <div class="console-shell console-shell--compact">
    <nav class="workspace-nav workspace-nav--top" aria-label="主导航">
      <a class="workspace-link" data-view="home" href="/ui">主页</a>
      <a class="workspace-link" data-view="overview" href="/ui/overview">交易总览</a>
      <a class="workspace-link" data-view="strategy" href="/ui/strategy">策略判断</a>
      <a class="workspace-link" data-view="execution" href="/ui/execution">委托与成交</a>
      <a class="workspace-link" data-view="risk" href="/ui/risk">风险与恢复</a>
      <a class="workspace-link" data-view="ai" href="/ui/ai">AI 工作台</a>
      <a class="workspace-link" data-view="aiConfig" href="/ui/ai-config">AI 配置</a>
      <a class="workspace-link" data-view="admin" href="/ui/settings">账户与权限</a>
    </nav>

    <section id="bannerContainer" class="banner-stack" aria-live="polite"></section>

    <main class="workspace">
      <div id="pageHead" class="page-head">
        <div>
          <p id="pageEyebrow" class="panel-kicker">主页</p>
          <h2 id="pageHeading">系统主控台</h2>
        </div>
        <p id="pageCopy" class="page-copy">这里集中查看状态、执行路径和最新风险提示。</p>
      </div>

      <section class="workspace-view is-active" data-view="home">
        <div class="panel-grid home-top-grid">
          <div class="span-12">
            <section id="statusRibbon" class="status-ribbon" aria-label="首页状态摘要"></section>
          </div>

          <div class="span-4">
            <section class="session-panel">
              <div>
                <p class="panel-kicker">登录会话</p>
                <h2 id="sessionIdentityValue">未登录</h2>
                <p id="sessionRoleValue" class="meta-copy">当前身份：未登录</p>
              </div>
              <div class="session-actions">
                <span id="authStateChip" class="status-pill tone-neutral">未登录</span>
                <div class="refresh-status">
                  <span id="refreshStateChip" class="status-pill tone-neutral refresh-state-chip">待刷新</span>
                  <span id="lastRefreshLabel" class="meta-copy">尚未刷新</span>
                </div>
                <button id="logoutButton" class="ghost-button">退出登录</button>
              </div>
            </section>
          </div>

          <div class="span-8">
            <section class="command-panel command-panel--compact" aria-label="人工控制">
              <div class="command-head">
                <div>
                  <p class="panel-kicker">人工操作</p>
                  <h2>控制动作</h2>
                </div>
              </div>

              <div class="command-grid">
                <button id="refreshButton" class="primary-button">刷新数据</button>
                <button id="reconcileButton" class="secondary-button">立即对账</button>
                <button id="rebaselineButton" class="warning-button">接受当前账户为新基线</button>
                <button id="resumeButton" class="ghost-button">恢复自动交易</button>
                <button id="haltButton" class="danger-button">暂停自动交易</button>
                <label class="toggle-pill toggle-pill--grid" for="autoRefreshToggle">
                  <input id="autoRefreshToggle" type="checkbox" checked>
                  <span class="toggle-pill__check" aria-hidden="true">✓</span>
                  <span class="toggle-pill__copy">
                    <strong>自动刷新</strong>
                    <span>每 10 秒刷新一次</span>
                  </span>
                </label>
              </div>

              <p id="actionPermissionHint" class="meta-copy">正在确认当前账号权限…</p>
            </section>
          </div>
        </div>

        <div id="homeContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="overview">
        <div id="overviewContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="strategy">
        <div id="strategyContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="execution">
        <div id="executionContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="risk">
        <div id="riskContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="ai">
        <div id="aiContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="aiConfig">
        <div id="aiConfigContent" class="view-layout"></div>
      </section>

      <section class="workspace-view" data-view="admin">
        <div id="adminContent" class="view-layout"></div>
      </section>
    </main>
  </div>

  <aside id="detailDrawer" class="detail-drawer" aria-hidden="true">
    <div class="detail-drawer__panel">
      <header class="detail-drawer__head">
        <div>
          <p id="drawerEyebrow" class="panel-kicker">详情</p>
          <h2 id="drawerTitle">明细面板</h2>
          <p id="drawerSummary" class="meta-copy">点击任意记录查看更完整的交易明细。</p>
        </div>
        <button id="closeDrawerButton" class="ghost-button">关闭</button>
      </header>
      <div id="drawerBody" class="detail-drawer__body"></div>
    </div>
  </aside>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <script type="module" charset="utf-8" src="/ui/app.js"></script>
</body>
</html>
