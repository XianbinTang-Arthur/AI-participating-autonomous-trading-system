# 合约实盘策略调参
# 这里只放策略、AI、自动换档、多策略与试盘守护相关参数。
# 数据库、端口、日志、交易所凭证、仓位上限等运行时 override 请改根目录 `.env.derivatives.live`。

# ══ RDP Active Parameters 注入 ═══════════════════════════════════
# 启用后，系统启动时自动读取 configs/active_parameter_sets/ 中的研究参数，
# 覆盖对应的生产配置字段。映射关系见 aats/bootstrap/active_parameters.py。
# 当前注入内容（由 RDP Phase 2 120天回测优化，共 17 个参数/combo）：
#   signal_edge_scale_bps=20 → strategy_signal_edge_scale_bps （score-based 信号放大）
#   score_stability_threshold=5 → strategy_hedge_independent_min_score_stability_bps
#     （bps 因子已统一为 ×100，两端语义一致）
#   min_confirm_ticks=2 → independent_min_confirm_ticks
#   min_safe_net_edge_bps=0 → independent_min_safe_net_edge_bps
#   entry_threshold / close_threshold → long + short entry/close 阈值
#   expected_slippage_buffer_bps / expected_execution_buffer_bps → 成本安全缓冲
active_parameters_enabled: true

# AI 与自动降级
# [常用可调] ai_operating_mode：AI 运行模式。可选值：baseline_only / ai_assisted / ai_decision_maker；推荐值：ai_decision_maker（AI 功能全面开放）。自动换档已独立，单独由 strategy_profile_auto_control_enabled 控制。
ai_operating_mode: ai_decision_maker
# [常用可调] ai_provider：AI 提供方。可选值：disabled / openai / deepseek；推荐值：deepseek。运行时可用 AI_SELECTOR 环境变量覆盖（AI_SELECTOR=DEEPSEEK|OPENAI）。
ai_provider: deepseek
# [常用可调] ai_model_name：AI 模型名。DeepSeek 可选：deepseek-v4-pro / deepseek-v4-flash；OpenAI 可选：gpt-4.1-mini / gpt-4o-mini 等；当前实盘试运行 deepseek-v4-flash 以降低同步决策延迟。
ai_model_name: deepseek-v4-flash
# [常用可调] ai_timeout_seconds：AI 请求超时秒数。可选值：1.0 ~ 60.0；当前 20.0。
# 重要约束：必须严格小于 _RUN_CYCLE_TIMEOUT_SECONDS=30.0（orchestrator.py:72，
# 由 test_run_cycle_timeout.py 锚定不可改）。如果两者相等，AI 一旦吃满预算，
# cycle 内剩余 ~11 个 phase（context_builder / baseline / target_engine /
# strategy_coordinator / publish_model …）就没有任何 buffer，必然撞 cycle
# timeout。20s 给后续 phase 留 ~10s 余量。
# 历史：10.0 → 30.0（commit 142fc8a 切 deepseek-flash 时为隔离变量临时拉满）
#       → 20.0（2026-04-24，发现 cycle_timeout=ai_timeout 数学不可能成立后回收）
ai_timeout_seconds: 20.0
# [常用可调] ai_degrade_after_failures：连续失败多少次后自动降级。可选值：1 ~ 10；推荐值：3。
ai_degrade_after_failures: 3
# [常用可调] ai_recovery_probe_interval_seconds：降级后多久做一次恢复探测。可选值：30 ~ 3600；推荐值：180.0。
ai_recovery_probe_interval_seconds: 180.0
# [常用可调] ai_decision_min_confidence：AI 决策最低置信度。可选值：0.0 ~ 1.0；推荐值：0.72。
ai_decision_min_confidence: 0.67
# [常用可调] ai_decision_max_uncertainty：AI 决策允许的最大不确定度。可选值：0.0 ~ 1.0；推荐值：0.38。
ai_decision_max_uncertainty: 0.38
# [常用可调] ai_decision_min_directional_edge：AI 方向信号最低边际。可选值：0.0 ~ 1.0；推荐值：0.16。
ai_decision_min_directional_edge: 0.16
# [常用可调] ai_shadow_mode_enabled：是否启用 AI shadow 观察。可选值：true / false；推荐值：true。
ai_shadow_mode_enabled: true
# [常用可调] ai_shadow_evaluation_window：shadow 评估窗口长度。可选值：5 ~ 200；推荐值：30。
ai_shadow_evaluation_window: 30
# ── Round 3 · 2026-04-22/23 · Paper trading shadow ────────────────────
# 非 AI 策略的候选参数 shadow 跑（和 AI shadow 正交，互不影响 live）。
# 三个正交单维 + 两个组合维度：
#   A) entry_post_only              —— 入场 IOC → post_only（maker）
#   B) edge_buffer_1bps             —— 噪音缓冲 2.0 → 1.0 bps
#   C) min_net_edge_1bps            —— 最小净边际 2.0 → 1.0 bps
#   D) combo_post_only_min_net_1    —— A + C 同时（最激进 cost + gate）
#   E) combo_post_only_buffer_1     —— A + B 同时（最激进 cost + noise）
# live 保持 IOC + 2.0/2.0 不变。
# 启用详情：docs/task/round3_paper_trading_usage.md
paper_trading_shadow_enabled: true
paper_trading_shadow_candidates:
  - candidate_id: "entry_post_only"
    family: "independent"
    overrides:
      strategy_hedge_independent_entry_execution_mode: "post_only_with_timeout_fallback"
  - candidate_id: "edge_buffer_1bps"
    family: "independent"
    overrides:
      strategy_edge_noise_buffer_bps: 1.0
  - candidate_id: "min_net_edge_1bps"
    family: "independent"
    overrides:
      strategy_min_net_edge_bps: 1.0
  - candidate_id: "combo_post_only_min_net_1"
    family: "independent"
    overrides:
      strategy_hedge_independent_entry_execution_mode: "post_only_with_timeout_fallback"
      strategy_min_net_edge_bps: 1.0
  - candidate_id: "combo_post_only_buffer_1"
    family: "independent"
    overrides:
      strategy_hedge_independent_entry_execution_mode: "post_only_with_timeout_fallback"
      strategy_edge_noise_buffer_bps: 1.0
# [常用可调] ai_outcome_review_bad_window_threshold：坏窗口数量达到多少后要求复核。可选值：1 ~ 20；推荐值：3。
ai_outcome_review_bad_window_threshold: 3
# [常用可调] ai_outcome_max_fee_ratio_delta：AI 相对 baseline 可多承担的费率漂移。可选值：0.0 ~ 1.0；推荐值：0.08。
ai_outcome_max_fee_ratio_delta: 0.08
# [常用可调] ai_outcome_max_churn_ratio_delta：AI 相对 baseline 可多承担的 churn 漂移。可选值：0.0 ~ 1.0；推荐值：0.12。
ai_outcome_max_churn_ratio_delta: 0.12
# [常用可调] ai_execution_suggestion_mode：AI 执行建议输出模式。可选值：disabled / diagnostic_only / shadow_translation / enabled_live；推荐值：enabled_live（AI 功能全面开放）。
ai_execution_suggestion_mode: enabled_live

# 策略家族路由
# [常用可调] strategy_family_active：默认主策略家族。当前这条实盘线显式固定为 independent，避免控制面继续显示 directional 兼容主语义。可选值：directional / smart_arbitrage / spot_grid / dca / protective / opportunistic / independent；推荐值：independent。
strategy_family_active: independent
# [常用可调] strategy_family_auto_selection_enabled：是否允许系统自动选择策略家族。可选值：true / false；推荐值：false。
# 关闭时锁定 strategy_family_active 为主策略。开启时 strategy_family_active 被忽略，
# coordinator 按 _SELECTION_PRIORITY_ORDER 竞争（directional 排在 independent 前，会抢占）。
strategy_family_auto_selection_enabled: false
# [常用可调] strategy_family_independent_enabled：是否启用 independent family。可选值：true / false；推荐值：true。
strategy_family_independent_enabled: true
# [进阶可调] strategy_family_independent_shadow_mode_enabled：是否仅让 independent family 以 shadow 方式评估。当前这条实盘线已直接接管执行主路径，需关闭 shadow-only。可选值：true / false；推荐值：false。
strategy_family_independent_shadow_mode_enabled: false
# [常用可调] strategy_family_independent_live_execution_enabled：是否允许 independent family 直接接管实盘 allocator / apply 主路径。可选值：true / false；推荐值：true。
strategy_family_independent_live_execution_enabled: true

# 兼容 family 兜底开关
# [常用可调] strategy_family_protective_enabled：是否启用 protective family cutover。当前实盘主模式不是 protective，默认关闭；切换到 protective 前需显式打开。可选值：true / false；推荐值：false。
strategy_family_protective_enabled: false
# [进阶可调] strategy_family_protective_shadow_mode_enabled：是否只让 protective family 参与 shadow 评估。当前 profile 不做 protective 灰度接管，推荐保持 false。可选值：true / false；推荐值：false。
strategy_family_protective_shadow_mode_enabled: false
# [常用可调] strategy_family_protective_live_execution_enabled：是否允许 protective family 直接接管实盘 allocator / apply 主路径。当前实盘主模式不是 protective，默认关闭。可选值：true / false；推荐值：false。
strategy_family_protective_live_execution_enabled: false
# [常用可调] strategy_family_opportunistic_enabled：是否启用 opportunistic family cutover。当前实盘主模式不是 opportunistic，默认关闭；切换前需显式打开。可选值：true / false；推荐值：false。
strategy_family_opportunistic_enabled: false
# [进阶可调] strategy_family_opportunistic_shadow_mode_enabled：是否只让 opportunistic family 参与 shadow 评估。当前 profile 不做 opportunistic 灰度接管，推荐保持 false。可选值：true / false；推荐值：false。
strategy_family_opportunistic_shadow_mode_enabled: false
# [常用可调] strategy_family_opportunistic_live_execution_enabled：是否允许 opportunistic family 直接接管实盘 allocator / apply 主路径。当前实盘主模式不是 opportunistic，默认关闭。可选值：true / false；推荐值：false。
strategy_family_opportunistic_live_execution_enabled: false

# ai自动档位与应急换档
# [常用可调] strategy_profile_auto_control_enabled：是否启用策略档位自动换档。这是唯一主开关；true 时系统会自动评估并默认启用自动激活规则，false 时只允许手动切档。可选值：true / false；推荐值：false。
strategy_profile_auto_control_enabled: true
# [常用可调] strategy_profile_auto_rollback_enabled：自动换档后是否允许自动回滚。可选值：true / false；推荐值：true。
strategy_profile_auto_rollback_enabled: true
# [常用可调] strategy_profile_emergency_safety_fast_track_enabled：风险事件时是否允许快速切到安全档。可选值：true / false；推荐值：true。
strategy_profile_emergency_safety_fast_track_enabled: true
# [常用可调] strategy_profile_emergency_safety_confidence_min：快速切档最低置信度。可选值：0.0 ~ 1.0；推荐值：0.68。
strategy_profile_emergency_safety_confidence_min: 0.67

# 多策略 sleeve 自动控制
# [常用可调] strategy_sleeve_auto_execution_enabled：是否允许自动下发非保护性 sleeve delta。可选值：true / false；推荐值：true。
strategy_sleeve_auto_execution_enabled: true
# [常用可调] strategy_sleeve_auto_min_budget_multiplier：自动收缩后的最小预算倍率。可选值：0.1 ~ 1.0；推荐值：0.35。
strategy_sleeve_auto_min_budget_multiplier: 0.35
# [常用可调] strategy_sleeve_auto_reconciliation_contraction_multiplier：对账压力下的预算收缩倍率。可选值：0.1 ~ 1.0；推荐值：0.50。
strategy_sleeve_auto_reconciliation_contraction_multiplier: 0.50
# [常用可调] strategy_sleeve_auto_soft_loss_usdt：进入软收缩的最近净亏损阈值。可选值：正数；推荐值：10.0。
strategy_sleeve_auto_soft_loss_usdt: 10.0
# [常用可调] strategy_sleeve_auto_hard_loss_usdt：在无库存时自动暂停的净亏损阈值。可选值：正数；推荐值：25.0。
strategy_sleeve_auto_hard_loss_usdt: 25.0
# [常用可调] strategy_sleeve_auto_volatility_cap_enabled：是否按波动率目标自动收缩预算。可选值：true / false；推荐值：true。
strategy_sleeve_auto_volatility_cap_enabled: true

# 统一交易成本
# [说明] 统一交易成本全部按 bps 填写，是百分比费率的万分之一，不是固定 USDT；8.0 = 0.08%，5.0 = 0.05%。实盘优先读取账户费率，拿不到时再回落到这里的兜底值。
trade_cost_spot_maker_fee_bps: 8.0
trade_cost_spot_taker_fee_bps: 10.0
trade_cost_margin_maker_fee_bps: 8.0
trade_cost_margin_taker_fee_bps: 10.0
trade_cost_derivatives_maker_fee_bps: 2.0
trade_cost_derivatives_taker_fee_bps: 5.0
trade_cost_delivery_settlement_fee_bps: 1.0
trade_cost_spot_spread_bps: 1.0
trade_cost_spot_slippage_bps: 1.5
trade_cost_margin_spread_bps: 1.0
trade_cost_margin_slippage_bps: 1.5
trade_cost_derivatives_spread_bps: 0.5
trade_cost_derivatives_slippage_bps: 1.0

