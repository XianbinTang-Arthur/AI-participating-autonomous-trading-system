# 原值 4.5 在 independent engine 中直接从 net_edge 扣除：
# net_edge = signal_edge - cost(7) - noise_buffer(4.5) → alpha=0.10 时 net_edge=-1.5 直接为负。
# 下调至 2.0，允许中等强度信号通过。
strategy_edge_noise_buffer_bps: 2.0
