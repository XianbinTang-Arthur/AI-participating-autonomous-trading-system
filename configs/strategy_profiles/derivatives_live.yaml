# 原值 2.0 过于保守，OKX swap 市场执行效率较高。下调至 0.5。
strategy_hedge_independent_expected_execution_buffer_bps: 0.5
# [进阶可调] strategy_hedge_independent_weak_edge_execution_mode：弱边际开仓如何处理。可选值：block / report_only；推荐值：block。
# 实盘安全审查：report_only 允许零净边际信号执行，导致手续费磨损。改为 block 阻止弱边际开仓。
strategy_hedge_independent_weak_edge_execution_mode: block
# [进阶可调] strategy_hedge_independent_max_acceptable_cost_bps：独立双书允许的最大单腿预期成本。可选值：0.0 以上；推荐值：7.5。
strategy_hedge_independent_max_acceptable_cost_bps: 7.5
# [进阶可调] strategy_hedge_independent_passive_first_enabled：弱边际开仓是否优先走 bounded-limit IOC。可选值：true / false；推荐值：true。
strategy_hedge_independent_passive_first_enabled: true
# [进阶可调] strategy_hedge_independent_min_confirm_ticks：独立双书开仓前要求的最少确认次数。可选值：>= 1；推荐值：2。
strategy_hedge_independent_min_confirm_ticks: 2
# [进阶可调] strategy_hedge_independent_min_score_drawdown_bps：独立双书允许的最大短期分数回撤。可选值：>= 0；推荐值：6.0。
strategy_hedge_independent_min_score_drawdown_bps: 6.0
# [进阶可调] strategy_hedge_independent_min_liquidity_quality：独立双书开仓要求的最低流动性质量分。可选值：0.0 ~ 1.0；推荐值：0.55。
strategy_hedge_independent_min_liquidity_quality: 0.55
# [进阶可调] strategy_hedge_independent_require_execution_health_ok：独立双书开仓是否要求执行健康度保持正常。可选值：true / false；推荐值：true。
strategy_hedge_independent_require_execution_health_ok: true

# thesis 生命周期与降风险
# [进阶可调] strategy_hedge_independent_max_thesis_age_seconds：独立双书 thesis 最长持有秒数，超过后允许按 stale thesis 退出。可选值：>= 1；推荐值：1800。
strategy_hedge_independent_max_thesis_age_seconds: 1800
# [进阶可调] strategy_hedge_independent_de_risk_net_edge_bps：净边际变薄时触发 de-risk 的阈值。可选值：>= 0；推荐值：2.0。
strategy_hedge_independent_de_risk_net_edge_bps: 2.0
# [进阶可调] strategy_hedge_independent_failed_thesis_net_edge_bps：净边际低于该值时视为 thesis 失效并直接收口。可选值：<= de-risk threshold；推荐值：-1.0。
strategy_hedge_independent_failed_thesis_net_edge_bps: -1.0
# [进阶可调] strategy_hedge_independent_catastrophic_failed_thesis_buffer_bps：灾难性 failed_thesis 缓冲 bps（whipsaw 防护）。仅当 net_edge <= failed_thesis_threshold - 此缓冲时才豁免 min_hold 立即出场。可选值：>= 0；推荐值：3.0。
strategy_hedge_independent_catastrophic_failed_thesis_buffer_bps: 3.0
# [进阶可调] strategy_hedge_independent_execution_health_de_risk_enabled：执行健康度退化时是否优先降风险。可选值：true / false；推荐值：true。
strategy_hedge_independent_execution_health_de_risk_enabled: true
# [进阶可调] strategy_hedge_independent_liquidity_de_risk_enabled：流动性质量恶化时是否优先降风险。可选值：true / false；推荐值：true。
strategy_hedge_independent_liquidity_de_risk_enabled: true

# 执行矩阵
# [进阶可调] strategy_hedge_independent_entry_execution_mode：independent 开仓动作采用的执行策略矩阵模式。可选值：adaptive / passive_first / bounded_limit / bounded_taker / aggressive_bounded_taker；推荐值：passive_first。
strategy_hedge_independent_entry_execution_mode: passive_first
# [进阶可调] strategy_hedge_independent_scale_in_execution_mode：independent 加仓动作采用的执行策略矩阵模式。可选值：adaptive / passive_first / bounded_limit / bounded_taker / aggressive_bounded_taker；推荐值：bounded_limit。
strategy_hedge_independent_scale_in_execution_mode: bounded_limit
# [进阶可调] strategy_hedge_independent_de_risk_execution_mode：independent 降风险动作采用的执行策略矩阵模式。可选值：adaptive / passive_first / bounded_limit / bounded_taker / aggressive_bounded_taker；推荐值：bounded_taker。
strategy_hedge_independent_de_risk_execution_mode: bounded_taker
# [进阶可调] strategy_hedge_independent_close_failed_thesis_execution_mode：independent thesis 失效退出采用的执行策略矩阵模式。可选值：adaptive / passive_first / bounded_limit / bounded_taker / aggressive_bounded_taker；推荐值：aggressive_bounded_taker。
strategy_hedge_independent_close_failed_thesis_execution_mode: aggressive_bounded_taker
# [进阶可调] strategy_hedge_independent_close_stale_execution_mode：independent thesis 过期退出采用的执行策略矩阵模式。可选值：adaptive / passive_first / bounded_limit / bounded_taker / aggressive_bounded_taker / post_only_with_timeout_fallback；推荐值：post_only_with_timeout_fallback。
# 2026-04-21 切换：bounded_limit (跨价吃流动性, 5 bps taker 费) → post_only_with_timeout_fallback
# (maker 挂单 + 3s 超时 fallback 到 bounded_taker; 期望成本 4.1 bps; 节省 ~0.9 bps).
# 见 docs/design/post_only_maker_exit_mode_2026_04_21.md (§3 解冻申请已签).
strategy_hedge_independent_close_stale_execution_mode: post_only_with_timeout_fallback
# [进阶可调] strategy_hedge_independent_limit_offset_bps_entry：independent 开仓走 bounded-limit IOC 时使用的限价偏移。可选值：>= 0；推荐值：1.5。
strategy_hedge_independent_limit_offset_bps_entry: 1.5
# [进阶可调] strategy_hedge_independent_limit_offset_bps_scale_in：independent 加仓走 bounded-limit IOC 时使用的限价偏移。可选值：>= 0；推荐值：1.0。
strategy_hedge_independent_limit_offset_bps_scale_in: 1.0
# [进阶可调] strategy_hedge_independent_limit_offset_bps_stale_close：independent stale thesis 收口的限价偏移。post_only 模式下表示 maker 挂单与 ref 的非跨价距离 (buy=ref×(1−offset), sell=ref×(1+offset))。可选值：>= 0；推荐值：0.8。
strategy_hedge_independent_limit_offset_bps_stale_close: 0.8

# post_only_with_timeout_fallback 专用配置 (2026-04-21 引入)
# 见 docs/design/post_only_maker_exit_mode_2026_04_21.md §3.1
# [进阶可调] strategy_hedge_independent_post_only_timeout_ms：post_only 挂单等待 maker 成交的最大毫秒数；超时即 cancel + fallback。可选值：>= 0；推荐值：3000.0。
strategy_hedge_independent_post_only_timeout_ms: 3000.0
# [进阶可调] strategy_hedge_independent_post_only_fallback_mode：超时未成交时的 fallback 模式。当前仅支持 bounded_taker (Layer 4 实现限制)。可选值：bounded_taker；推荐值：bounded_taker。
strategy_hedge_independent_post_only_fallback_mode: bounded_taker
# [进阶可调] strategy_hedge_independent_post_only_expected_fill_rate：成本估计模型用的 maker 成交率假设。fee = maker × fill_rate + taker × (1 − fill_rate)。可选值：[0, 1]；推荐值：0.3 (保守估计, 见 evidence doc §4.3)。
strategy_hedge_independent_post_only_expected_fill_rate: 0.3

# 诊断输出
# [进阶可调] strategy_hedge_independent_emit_book_level_metrics：是否输出独立双书的 book 级诊断指标。可选值：true / false；推荐值：true。
strategy_hedge_independent_emit_book_level_metrics: true
# [进阶可调] strategy_hedge_independent_emit_expected_vs_realized_metrics：是否输出预期 vs 已实现诊断。可选值：true / false；推荐值：true。
strategy_hedge_independent_emit_expected_vs_realized_metrics: true
# [进阶可调] strategy_hedge_independent_emit_close_reason_metrics：是否输出退出原因分布诊断。可选值：true / false；推荐值：true。
strategy_hedge_independent_emit_close_reason_metrics: true
# [进阶可调] strategy_hedge_independent_emit_execution_policy_metrics：是否输出执行策略与被动优先使用诊断。可选值：true / false；推荐值：true。
strategy_hedge_independent_emit_execution_policy_metrics: true

# 受控 rollout 开关
# [进阶可调] strategy_hedge_independent_adaptive_rollout_enabled：是否把自适应阈值层正式接入 live 语义。当前实盘继续保持显式关闭，只输出 shadow 摘要。可选值：true / false；推荐值：false。
strategy_hedge_independent_adaptive_rollout_enabled: false
# [进阶可调] strategy_hedge_independent_health_enforcement_enabled：是否把健康内核从摘要提升为行为约束。当前实盘继续保持显式关闭。可选值：true / false；推荐值：false。
strategy_hedge_independent_health_enforcement_enabled: false
# [进阶可调] strategy_hedge_independent_size_down_entry_enabled：是否对 entry 启用按资本/波动的缩尺。当前实盘继续保持显式关闭。可选值：true / false；推荐值：false。
strategy_hedge_independent_size_down_entry_enabled: false
# [进阶可调] strategy_hedge_independent_long_short_asymmetry_enabled：是否启用 long/short 非对称 sizing。当前实盘继续保持显式关闭。可选值：true / false；推荐值：false。
strategy_hedge_independent_long_short_asymmetry_enabled: false
# [进阶可调] strategy_hedge_independent_short_asymmetry_penalty_multiplier：启用 short 非对称时的缩尺倍率。当前 profile 显式钉住默认值，避免继续隐式回落到 settings 默认。可选值：0.0 ~ 1.0；推荐值：0.85。
strategy_hedge_independent_short_asymmetry_penalty_multiplier: 0.85
# [进阶可调] strategy_hedge_independent_entry_size_down_floor：启用 size-down 时的最小 entry 倍率下限。当前 profile 显式钉住默认值。可选值：0.0 ~ 1.0；推荐值：0.50。
strategy_hedge_independent_entry_size_down_floor: 0.50

# 通用策略行为约束
# [常用可调] strategy_min_hold_seconds：最短持仓秒数。可选值：0 ~ 86400；推荐值：900.0。
strategy_min_hold_seconds: 720.0
# [常用可调] strategy_post_close_cooldown_seconds：平仓后冷却秒数。可选值：0 ~ 86400；推荐值：300.0。
strategy_post_close_cooldown_seconds: 300.0
# [常用可调] strategy_max_fee_drag_ratio：允许的最大费耗比例。可选值：0.0 ~ 1.0；推荐值：0.48。
strategy_max_fee_drag_ratio: 0.48
# [常用可调] strategy_max_churn_ratio：允许的最大 churn 比例。可选值：0.0 ~ 1.0；推荐值：0.42。
strategy_max_churn_ratio: 0.42

