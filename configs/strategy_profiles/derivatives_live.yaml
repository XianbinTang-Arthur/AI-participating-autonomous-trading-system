# [常用可调] strategy_expected_slippage_bps_fraction：预估滑点占保护阈值的比例。可选值：0.0 ~ 1.0；推荐值：0.35。
# 原值 0.28 导致 configured_slippage = max_tolerance(20) × 0.28 = 5.6 bps，
# 使 expected_cost = taker(5.0) + slip(5.6) = 10.6 bps，严重膨胀。
# OKX BTC-USDT-SWAP 实际滑点通常 <1 bps，下调至 0.05 → configured_slippage = 1.0 bps。
strategy_expected_slippage_bps_fraction: 0.05
