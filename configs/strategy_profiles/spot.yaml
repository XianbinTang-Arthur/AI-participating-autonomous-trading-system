# 现货（模拟盘 / 非实盘）策略调参
# 这里只放策略、AI、自动换档、多策略与试盘守护相关参数。
# 数据库、端口、日志、交易所凭证、仓位上限等运行时 override 请改根目录 `.env.spot`。

# >>> TEMP-HACK-E (2026-04-08): 和 derivatives.yaml 对齐的同源补丁
# 4 套 managed profile 里 spot/derivatives 两个模拟盘 profile（environment=dev）都把
# operator_session_cookie_secure 默认成 False（dev UX 友好），但 config.py 的 exchange
# runtime hardening gate 对 exchange_coupled=True（含模拟盘）强制要 True —— 直接冲突。
# 而 AATS_OPERATOR_SESSION_COOKIE_SECURE 又在 MANAGED_PROFILE_DERIVED_ENV_KEYS，env var
# override 会被剥离，只能在 strategy yaml 里打补丁。
#
# 对应的 admin user 校验通过 compose override 把 AATS_OPERATOR_SESSION_SECRET 置空
# （operator_session_configured→False）来绕过。两手配合同 derivatives。
#
# 本条只在 spot 模拟盘 + docker-compose 4 进程 / 官方 scripts/start_api.py 场景下触发
# （spot_live 和 derivatives_live 的 runtime_defaults 已经是 cookie_secure=True，不需要补丁）。
# 根因修复 slice 落地后和 derivatives.yaml 同步移除。grep 'TEMP-HACK-E' 即可定位。
operator_session_cookie_secure: true
# <<< TEMP-HACK-E

# AI 与自动降级
# [常用可调] ai_operating_mode：AI 运行模式。可选值：baseline_only / ai_assisted / ai_decision_maker / ai_decision_maker_with_profile_control；推荐值：baseline_only。
ai_operating_mode: baseline_only
# [常用可调] ai_provider：AI 提供方。可选值：disabled / openai；推荐值：openai。
ai_provider: openai
# [常用可调] ai_model_name：AI 模型名。可选值：可用的 OpenAI 模型名；推荐值：gpt-4.1-mini。
ai_model_name: gpt-4.1-mini
# [常用可调] ai_timeout_seconds：AI 请求超时秒数。可选值：1.0 ~ 60.0；推荐值：10.0。
ai_timeout_seconds: 10.0
# [常用可调] ai_degrade_after_failures：连续失败多少次后自动降级。可选值：1 ~ 10；推荐值：4。
ai_degrade_after_failures: 4
# [常用可调] ai_recovery_probe_interval_seconds：降级后多久做一次恢复探测。可选值：30 ~ 3600；推荐值：180.0。
ai_recovery_probe_interval_seconds: 180.0
# [常用可调] ai_decision_min_confidence：AI 决策最低置信度。可选值：0.0 ~ 1.0；推荐值：0.75。
ai_decision_min_confidence: 0.75
# [常用可调] ai_decision_max_uncertainty：AI 决策允许的最大不确定度。可选值：0.0 ~ 1.0；推荐值：0.38。
ai_decision_max_uncertainty: 0.38
# [常用可调] ai_decision_min_directional_edge：AI 方向信号最低边际。可选值：0.0 ~ 1.0；推荐值：0.18。
ai_decision_min_directional_edge: 0.18
# [常用可调] ai_shadow_mode_enabled：是否启用 AI shadow 观察。可选值：true / false；推荐值：false。
ai_shadow_mode_enabled: false
# [常用可调] ai_shadow_evaluation_window：shadow 评估窗口长度。可选值：5 ~ 200；推荐值：30。
ai_shadow_evaluation_window: 30
# [常用可调] ai_outcome_review_bad_window_threshold：坏窗口数量达到多少后要求复核。可选值：1 ~ 20；推荐值：3。
ai_outcome_review_bad_window_threshold: 3
# [常用可调] ai_outcome_max_fee_ratio_delta：AI 相对 baseline 可多承担的费率漂移。可选值：0.0 ~ 1.0；推荐值：0.08。
ai_outcome_max_fee_ratio_delta: 0.08
# [常用可调] ai_outcome_max_churn_ratio_delta：AI 相对 baseline 可多承担的 churn 漂移。可选值：0.0 ~ 1.0；推荐值：0.10。
ai_outcome_max_churn_ratio_delta: 0.10
# [常用可调] ai_execution_suggestion_mode：AI 执行建议输出模式。可选值：disabled / diagnostic_only / shadow_translation / enabled_live；推荐值：enabled_live。
ai_execution_suggestion_mode: enabled_live

# 策略家族与自动换档
# [常用可调] strategy_family_active：默认主策略家族。可选值：directional / smart_arbitrage / spot_grid / dca；推荐值：directional。
strategy_family_active: directional
# [常用可调] strategy_family_auto_selection_enabled：是否允许系统自动选择策略家族。可选值：true / false；推荐值：true。
strategy_family_auto_selection_enabled: true
# [常用可调] strategy_profile_auto_control_enabled：是否启用策略档位自动换档。这是唯一主开关；true 时系统会自动评估并默认启用自动激活规则，false 时只允许手动切档。可选值：true / false；推荐值：true。
strategy_profile_auto_control_enabled: true
# [常用可调] strategy_profile_auto_rollback_enabled：自动换档后是否允许自动回滚。可选值：true / false；推荐值：true。
strategy_profile_auto_rollback_enabled: true
# [常用可调] strategy_profile_emergency_safety_fast_track_enabled：风险事件时是否允许快速切到安全档。可选值：true / false；推荐值：true。
strategy_profile_emergency_safety_fast_track_enabled: true
# [常用可调] strategy_profile_emergency_safety_confidence_min：快速切档最低置信度。可选值：0.0 ~ 1.0；推荐值：0.68。
strategy_profile_emergency_safety_confidence_min: 0.68

# 多策略 sleeve 自动控制
# [常用可调] strategy_sleeve_auto_execution_enabled：是否允许非保护性 sleeve 自动进入执行链。可选值：true / false；推荐值：true。
strategy_sleeve_auto_execution_enabled: true
# [常用可调] strategy_sleeve_auto_min_budget_multiplier：自动收缩后的最小预算倍率。可选值：0.1 ~ 1.0；推荐值：0.35。
strategy_sleeve_auto_min_budget_multiplier: 0.35
# [常用可调] strategy_sleeve_auto_reconciliation_contraction_multiplier：对账压力下的预算收缩倍率。可选值：0.1 ~ 1.0；推荐值：0.50。
strategy_sleeve_auto_reconciliation_contraction_multiplier: 0.50
# [常用可调] strategy_sleeve_auto_soft_loss_usdt：进入软收缩的最近净亏损阈值。可选值：正数；推荐值：10.0。
strategy_sleeve_auto_soft_loss_usdt: 10.0
# [常用可调] strategy_sleeve_auto_hard_loss_usdt：在无库存时自动暂停的净亏损阈值。可选值：正数；推荐值：25.0。
strategy_sleeve_auto_hard_loss_usdt: 25.0
# [常用可调] strategy_sleeve_auto_volatility_cap_enabled：是否按波动率目标自动收缩预算。可选值：true / false；推荐值：true。
strategy_sleeve_auto_volatility_cap_enabled: true

# 统一交易成本
# [说明] 统一交易成本全部按 bps 填写，是百分比费率的万分之一，不是固定 USDT；8.0 = 0.08%，5.0 = 0.05%。实盘优先读取账户费率，拿不到时再回落到这里的兜底值。
trade_cost_spot_maker_fee_bps: 8.0
trade_cost_spot_taker_fee_bps: 10.0
trade_cost_margin_maker_fee_bps: 8.0
trade_cost_margin_taker_fee_bps: 10.0
trade_cost_derivatives_maker_fee_bps: 2.0
trade_cost_derivatives_taker_fee_bps: 5.0
trade_cost_delivery_settlement_fee_bps: 1.0
trade_cost_spot_spread_bps: 1.0
trade_cost_spot_slippage_bps: 1.5
trade_cost_margin_spread_bps: 1.0
trade_cost_margin_slippage_bps: 1.5
trade_cost_derivatives_spread_bps: 0.5
trade_cost_derivatives_slippage_bps: 1.0

# 多策略启停
# 现货 profile 不再重复维护智能套利参数；合约专属配置统一放在 derivatives*.yaml，缺省值回退到 settings 默认值。
# [常用可调] spot_grid_enabled：是否启用现货网格。可选值：true / false；推荐值：true。
spot_grid_enabled: true
# [常用可调] spot_grid_anchor_lookback_snapshots：网格锚点回看快照数。可选值：5 ~ 500；推荐值：24。
spot_grid_anchor_lookback_snapshots: 24
# [常用可调] spot_grid_band_bps：网格带宽。可选值：10.0 ~ 1000.0；推荐值：150.0。
spot_grid_band_bps: 150.0
# [常用可调] spot_grid_inventory_floor_fraction：网格库存下限占比。可选值：0.0 ~ 1.0；推荐值：0.15。
spot_grid_inventory_floor_fraction: 0.15
# [常用可调] spot_grid_inventory_ceiling_fraction：网格库存上限占比。可选值：0.0 ~ 1.5；推荐值：1.0。
spot_grid_inventory_ceiling_fraction: 1.0
# [常用可调] spot_grid_rebalance_min_fraction_of_max_qty：触发再平衡的最小仓位占比。可选值：0.0 ~ 1.0；推荐值：0.08。
spot_grid_rebalance_min_fraction_of_max_qty: 0.08
# [常用可调] spot_grid_breakout_guard_enabled：是否启用突破保护，避免趋势行情里继续网格化。可选值：true / false；推荐值：true。
spot_grid_breakout_guard_enabled: true
# [常用可调] dca_enabled：是否启用定投策略。可选值：true / false；推荐值：true。
dca_enabled: true
# [常用可调] dca_interval_seconds：定投周期秒数。可选值：正数；推荐值：86400.0。
dca_interval_seconds: 86400.0
# [常用可调] dca_quote_budget_per_cycle：每次定投预算。可选值：正数；推荐值：25.0。
dca_quote_budget_per_cycle: 25.0
# [常用可调] dca_max_position_fraction_of_limit：定投最多吃到仓位上限的比例。可选值：0.0 ~ 1.0；推荐值：1.0。
dca_max_position_fraction_of_limit: 1.0
# [常用可调] dca_pullback_only_enabled：是否只在回撤时买入。可选值：true / false；推荐值：false。
dca_pullback_only_enabled: false
# [常用可调] dca_pullback_entry_bps：回撤买入阈值。可选值：0.0 ~ 500.0；推荐值：40.0。
dca_pullback_entry_bps: 40.0

# 决策节奏
# [常用可调] max_decisions_per_minute：每分钟最多允许多少次决策。可选值：1 ~ 20；推荐值：3。
max_decisions_per_minute: 3
# [常用可调] decision_min_interval_seconds_15m：15m 周期最小决策间隔。可选值：0.0 ~ 600.0；推荐值：75.0。
decision_min_interval_seconds_15m: 75.0
# [常用可调] decision_min_interval_seconds_1h：1h 周期最小决策间隔。可选值：0.0 ~ 1800.0；推荐值：300.0。
decision_min_interval_seconds_1h: 300.0
# [常用可调] decision_min_price_move_bps：触发新决策前要求的最小价格变动。可选值：0.0 ~ 50.0；推荐值：4.0。
decision_min_price_move_bps: 4.0
# [常用可调] decision_min_momentum_delta：触发新决策前要求的最小动量变化。可选值：0.0 ~ 0.01；推荐值：0.0005。
decision_min_momentum_delta: 0.0005

# directional 细分阈值
# 现货 profile 只保留 long/共享 directional 参数；合约专属的 short bias、动态杠杆和 short 阈值统一维护在 derivatives*.yaml。
# [常用可调] strategy_flat_signal_hold_enabled：flat 信号时是否优先持有而不是立刻退出。可选值：true / false；推荐值：true。
strategy_flat_signal_hold_enabled: true
# [常用可调] strategy_flat_exit_microstructure_threshold：flat 退出的微观结构阈值。可选值：0.0 ~ 1.0；推荐值：0.18。
strategy_flat_exit_microstructure_threshold: 0.18
# [常用可调] strategy_flat_exit_factor_threshold：flat 退出的因子阈值。可选值：0.0 ~ 1.0；推荐值：0.28。
strategy_flat_exit_factor_threshold: 0.28
# [常用可调] strategy_flat_exit_ai_edge_threshold：flat 退出的 AI edge 阈值。可选值：0.0 ~ 1.0；推荐值：0.32。
strategy_flat_exit_ai_edge_threshold: 0.32
# [常用可调] strategy_expected_slippage_bps_fraction：预估滑点占保护阈值的比例。可选值：0.0 ~ 1.0；推荐值：0.35。
strategy_expected_slippage_bps_fraction: 0.30
# [常用可调] strategy_edge_noise_buffer_bps：边际噪音缓冲。可选值：0.0 ~ 50.0；推荐值：8.0。
strategy_edge_noise_buffer_bps: 4.5
# [常用可调] strategy_min_net_edge_bps：最小净边际。可选值：0.0 ~ 50.0；推荐值：8.0。
strategy_min_net_edge_bps: 5.0
# [常用可调] strategy_entry_allowed_regimes：允许新开仓的市场状态。可选值：trend / breakout / range / uncertain / high_volatility；推荐值：trend, breakout。
strategy_entry_allowed_regimes:
  - trend
  - breakout
# [常用可调] strategy_entry_min_signal_edge_bps：开仓最低信号边际。可选值：0.0 ~ 100.0；推荐值：16.0。
strategy_entry_min_signal_edge_bps: 14.0
# [常用可调] strategy_entry_alpha_min：开仓最低 alpha。可选值：0.0 ~ 1.0；推荐值：0.20。
strategy_entry_alpha_min: 0.18
# [常用可调] strategy_entry_confidence_min：开仓最低置信度。可选值：0.0 ~ 1.0；推荐值：0.66。
strategy_entry_confidence_min: 0.63
# [常用可调] strategy_scale_in_min_signal_edge_bps：加仓最低信号边际。可选值：0.0 ~ 100.0；推荐值：20.0。
strategy_scale_in_min_signal_edge_bps: 18.0
# [常用可调] strategy_scale_in_alpha_min：加仓最低 alpha。可选值：0.0 ~ 1.0；推荐值：0.26。
strategy_scale_in_alpha_min: 0.24
# [常用可调] strategy_scale_in_confidence_min：加仓最低置信度。可选值：0.0 ~ 1.0；推荐值：0.74。
strategy_scale_in_confidence_min: 0.71
# [常用可调] strategy_reversal_min_signal_edge_bps：反手最低信号边际。可选值：0.0 ~ 100.0；推荐值：26.0。
strategy_reversal_min_signal_edge_bps: 24.0
# [常用可调] strategy_reversal_alpha_min：反手最低 alpha。可选值：0.0 ~ 1.0；推荐值：0.36。
strategy_reversal_alpha_min: 0.34
# [常用可调] strategy_reversal_confidence_min：反手最低置信度。可选值：0.0 ~ 1.0；推荐值：0.82。
strategy_reversal_confidence_min: 0.79
# [常用可调] strategy_min_hold_seconds：最短持仓秒数。可选值：0 ~ 86400；推荐值：2400.0。
strategy_min_hold_seconds: 720.0
# [常用可调] strategy_post_close_cooldown_seconds：平仓后冷却秒数。可选值：0 ~ 86400；推荐值：1800.0。
strategy_post_close_cooldown_seconds: 360.0
# [常用可调] strategy_max_fee_drag_ratio：允许的最大费耗比例。可选值：0.0 ~ 1.0；推荐值：0.40。
strategy_max_fee_drag_ratio: 0.38
# [常用可调] strategy_max_churn_ratio：允许的最大 churn 比例。可选值：0.0 ~ 1.0；推荐值：0.35。
strategy_max_churn_ratio: 0.30
# [常用可调] strategy_low_edge_threshold_bps：低边际识别阈值。可选值：0.0 ~ 50.0；推荐值：5.0。
strategy_low_edge_threshold_bps: 4.5
# [常用可调] strategy_low_edge_streak_limit：低边际连续触发次数上限。可选值：1 ~ 20；推荐值：3。
strategy_low_edge_streak_limit: 3
# [常用可调] strategy_low_edge_cooldown_seconds：低边际触发后的冷却秒数。可选值：0 ~ 86400；推荐值：5400.0。
strategy_low_edge_cooldown_seconds: 1800.0
# [常用可调] strategy_transient_close_retry_cooldown_seconds：瞬时平仓失败后的重试冷却。可选值：0 ~ 3600；推荐值：90.0。
strategy_transient_close_retry_cooldown_seconds: 90.0

# 试盘守护
# [常用可调] trial_guard_enabled：是否启用试盘守护。可选值：true / false；推荐值：true。
trial_guard_enabled: true
# [常用可调] trial_guard_poll_interval_seconds：试盘守护轮询间隔。可选值：1.0 ~ 300.0；推荐值：15.0。
trial_guard_poll_interval_seconds: 15.0
# [常用可调] trial_guard_lookback_fills：回看成交数量。可选值：1 ~ 500；推荐值：30。
trial_guard_lookback_fills: 30
# [常用可调] trial_guard_min_closed_fills：开始评估前要求的最少已平仓成交数。可选值：1 ~ 100；推荐值：5。
trial_guard_min_closed_fills: 5
# [常用可调] trial_guard_max_daily_loss_usdt：当日最大亏损阈值。可选值：正数；推荐值：25.0。
trial_guard_max_daily_loss_usdt: 25.0
# [常用可调] trial_guard_max_consecutive_losses：最大连续亏损次数。可选值：1 ~ 20；推荐值：4。
trial_guard_max_consecutive_losses: 4
# [常用可调] trial_guard_max_fee_to_notional_ratio：最大费耗/名义金额比。可选值：0.0 ~ 1.0；推荐值：0.0012。
trial_guard_max_fee_to_notional_ratio: 0.0012
# [常用可调] trial_guard_max_high_slippage_ratio：高滑点成交占比上限。可选值：0.0 ~ 1.0；推荐值：0.35。
trial_guard_max_high_slippage_ratio: 0.35
# [常用可调] trial_guard_max_slow_submit_to_fill_ratio：慢提交到成交占比上限。可选值：0.0 ~ 1.0；推荐值：0.35。
trial_guard_max_slow_submit_to_fill_ratio: 0.35
