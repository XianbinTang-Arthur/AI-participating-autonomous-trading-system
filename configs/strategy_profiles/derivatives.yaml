strategy_hedge_independent_long_close_threshold: 0.66
# [进阶可调] strategy_hedge_independent_short_close_threshold：独立 short book 的平仓阈值。当前 dry-run 配置显式钉住与 entry 一致，避免依赖 settings 隐式回填。可选值：0.0 ~ entry threshold；推荐值：0.66。
strategy_hedge_independent_short_close_threshold: 0.66
# [进阶可调] strategy_hedge_independent_long_scale_in_threshold：独立 long book 的加仓阈值。可选值：0.0 ~ 1.0；推荐值：0.70。
strategy_hedge_independent_long_scale_in_threshold: 0.70
# [进阶可调] strategy_hedge_independent_short_scale_in_threshold：独立 short book 的加仓阈值。可选值：0.0 ~ 1.0；推荐值：0.70。
