# [进阶可调] strategy_short_reversal_alpha_min：反手做空最低 alpha。当前只在合约运行域生效。可选值：0.0 ~ 1.0；推荐值：0.18。
strategy_short_reversal_alpha_min: 0.18
# [进阶可调] strategy_short_reversal_confidence_min：反手做空最低置信度。当前只在合约运行域生效。可选值：0.0 ~ 1.0；推荐值：0.55。
strategy_short_reversal_confidence_min: 0.55
# overlay 总开关与主模式
