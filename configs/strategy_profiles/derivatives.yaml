strategy_hedge_independent_failed_thesis_net_edge_bps: -1.0
# [进阶可调] strategy_hedge_independent_catastrophic_failed_thesis_buffer_bps：灾难性 failed_thesis 缓冲 bps（whipsaw 防护）。仅当 net_edge <= failed_thesis_threshold - 此缓冲时才豁免 min_hold 立即出场。可选值：>= 0；推荐值：3.0。
