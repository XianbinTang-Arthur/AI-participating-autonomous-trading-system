# 指定当前运行环境名称。
environment: dev

# 指定当前配置档案名称。
config_profile: local_demo

# 指定系统运行模式。
mode: paper_live

# 指定默认交易标的。
default_symbol: BTC-USDT

# 指定主决策周期。
primary_timeframe: 15m

# 指定辅助决策周期。
secondary_timeframe: 1h

# 指定允许触发决策的周期列表。
enabled_decision_timeframes:
  - 15m

# 指定本地初始资金。
initial_usdt_balance: 10000.0

# 指定存储模式。
storage_mode: memory

# 指定事件持久化策略。
event_persistence_mode: strict

# 指定市场数据后端。
market_data_backend: demo

# 指定执行后端。
execution_backend: paper

# 指定账户读取后端。
account_backend: disabled

# 指定是否启用账户读取。
account_read_enabled: false

# 指定是否允许真实提交。
live_submit_enabled: false

# 指定 guarded 执行是否只做演练。
guarded_execution_dry_run: true

# 指定启动时是否从交易所账户初始化组合快照。
bootstrap_portfolio_from_exchange: false

# 指定数据库连接串。
database_url: postgresql+psycopg://aats:aats@localhost:5432/aats

# 指定是否自动创建数据库表结构。
database_auto_create_schema: true

# 指定单品种最大绝对仓位数量。
max_abs_position_qty: 0.01

# 指定单品种最大名义价值上限。
max_notional_per_symbol: 1000.0

# 指定最大未完成挂单数量。
max_open_orders: 5

# 指定每分钟最多允许多少次决策触发。
max_decisions_per_minute: 6

# 指定默认下单数量。
default_order_qty: 0.001

# 指定本地市场数据循环发布次数。
local_publish_iterations: 6

# 指定本地市场数据循环发布间隔秒数。
local_publish_interval_seconds: 0.0

# 指定 15m 周期两次决策之间的最小间隔秒数。
decision_min_interval_seconds_15m: 0.0

# 指定 1h 周期两次决策之间的最小间隔秒数。
decision_min_interval_seconds_1h: 0.0

# 指定触发决策所需的最小价格变化基点。
decision_min_price_move_bps: 0.0

# 指定触发决策所需的最小动量变化阈值。
decision_min_momentum_delta: 0.0

# 指定 paper 执行的默认 taker 手续费基点。
paper_taker_fee_bps: 5.0

# 指定最大允许滑点容忍度基点。
max_slippage_tolerance_bps: 20

# 指定 AI 工作模式。
ai_operating_mode: baseline_only

# 指定 AI 提供方。
ai_provider: disabled

# 指定 AI 模型名称。
ai_model_name: gpt-4o-mini

# 指定 AI 提示词版本号。
ai_prompt_version: 0.2.0

# 指定 AI 模型版本号。
ai_model_version: 1.0.0

# 指定 AI 超时时间。
ai_timeout_seconds: 5.0

# 指定 AI 最大重试次数。
ai_max_retries: 0

# 指定 AI 连续失败多少次后降级。
ai_degrade_after_failures: 3

# 指定 AI 连续成功多少次后恢复。
ai_recover_after_successes: 2

# 指定 AI 主决策最小置信度。
ai_decision_min_confidence: 0.6
ai_decision_max_uncertainty: 0.35
ai_decision_min_directional_edge: 0.2

# 指定 OpenAI 接口基地址。
openai_base_url: https://api.openai.com

# 指定市场数据多久算过期。
market_data_stale_after_seconds: 30.0

# 指定账户状态多久算过期。
account_state_stale_after_seconds: 60.0

# 指定对账结果多久算过期。
reconciliation_stale_after_seconds: 300.0

# 指定 OKX REST 地址。
okx_rest_url: https://www.okx.com

# 指定 OKX 公共频道 WebSocket 地址。
okx_public_ws_url: wss://ws.okx.com:8443/ws/v5/public

# 指定 OKX 业务频道 WebSocket 地址。
okx_business_ws_url: wss://ws.okx.com:8443/ws/v5/business

# 指定是否启用 OKX 模拟交易。
okx_simulated_trading: false

# 指定 OKX 调用超时时间。
okx_timeout_seconds: 10.0

# 指定 OKX 市场数据重连等待秒数。
okx_market_reconnect_delay_seconds: 2.0

# 指定 OKX 账户刷新间隔秒数。
okx_account_refresh_interval_seconds: 15.0

# 指定 OKX 执行同步间隔秒数。
okx_execution_sync_interval_seconds: 5.0

# 指定单次拉取 fills 的数量上限。
okx_fill_fetch_limit: 100

# 指定是否启用浏览器登录鉴权。
operator_auth_enabled: false

# 指定无鉴权状态下是否允许危险写操作。
operator_unsafe_write_without_auth: false

# 指定浏览器登录 cookie 名称。
operator_session_cookie_name: aats_operator_session

# 指定浏览器登录 cookie 有效期。
operator_session_max_age_seconds: 43200

# 指定浏览器登录 cookie 是否要求 HTTPS。
operator_session_cookie_secure: false

# 指定日志级别。
log_level: INFO

# 指定日志目录。
log_dir: logs

# 指定日志轮转最大字节数。
log_rotate_max_bytes: 5242880

# 指定日志备份文件数量。
log_backup_count: 7

# 指定交易所名称标识。
exchange_name: PAPER
