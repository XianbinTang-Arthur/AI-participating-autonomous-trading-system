# =============================================================================
# AATS 4 进程 — OKX 衍生品模拟盘 override
#
# 用途：在 docker-compose.aats.yml 基础上叠加 .env.derivatives 凭证文件 + 设置
#       AATS_PROFILE=derivatives，让 base compose 里的 scripts/compose_entrypoint.py
#       shim 在每个进程启动前调 load_profiled_dotenv_into_process() 注入
#       AATS_STARTUP_PROFILE / AATS_ENV_TEMPLATE_PROFILE 两个派生变量，
#       走 managed profile derivatives runtime_defaults 分支。
#
# 运维入口（仓库根）：scripts/deploy.sh --profile derivatives --skip-commit
# 本 override 只由标准部署脚本编排，不得手工执行 docker compose。
#
# 说明：
#   - 本文件和 docker-compose.aats.spot.yml 结构完全对齐（spot ↔ derivatives 镜像对称）
#   - .env.wsl2 继续负责 POSTGRES_USER/PASSWORD 等 compose 模板插值
#   - .env.derivatives 只被容器进程读到，不参与 compose 模板插值
#   - 凭证文件放在项目根 (../../.env.derivatives)，已被 .gitignore 屏蔽
#   - 本 override 文件 **不含任何** API key / secret，只声明文件路径引用
#   - 不再需要 volumes mount 补 strategy_profiles yaml（Plan E 的临时 hack 补丁
#     已经被 slice docker-compose-hardening 工作包 A 的 validator 放行替代）
# =============================================================================

name: aats-dev

# derivatives managed profile hint —— 让 base compose 里的 entrypoint shim
# 在启动前调 load_profiled_dotenv_into_process(profile='derivatives')，
# 把 AATS_STARTUP_PROFILE 和 AATS_ENV_TEMPLATE_PROFILE 注入 os.environ。
x-aats-derivatives-env: &aats-derivatives-env
  AATS_PROFILE: derivatives

services:
  # derivatives 模拟栈也采集不需要交易凭证的 OKX 公共微观结构数据。
  # 采集器只写 aats_research，不订阅 execution command，也不加载 live env。
  prometheus:
    volumes:
      - ./prometheus/targets/microstructure.yml:/etc/prometheus/targets/microstructure.yml:ro

  aats-gateway:
    env_file:
      - ../../.env.derivatives
    environment:
      <<: *aats-derivatives-env

  aats-market:
    env_file:
      - ../../.env.derivatives
    environment:
      <<: *aats-derivatives-env

  aats-decision:
    env_file:
      - ../../.env.derivatives
    environment:
      <<: *aats-derivatives-env

  aats-execution:
    env_file:
      - ../../.env.derivatives
    environment:
      <<: *aats-derivatives-env

  aats-rdp-daemon:
    env_file:
      - ../../.env.derivatives
    environment:
      <<: *aats-derivatives-env
      AATS_PROCESS_ROLE: rdp-daemon

  aats-liquidations-daemon:
    build:
      context: ../..
      dockerfile: deploy/wsl2-dev/Dockerfile
    image: aats-base:dev
    container_name: aats-liquidations-daemon
    restart: unless-stopped
    environment:
      AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_LOG_FORMAT: json
      AATS_LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    command: ["python", "scripts/liquidations_ws_daemon.py"]
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/aats_liquidations_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_liquidations_heartbeat))) -lt 60",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  aats-microstructure-collector:
    build:
      context: ../..
      dockerfile: deploy/wsl2-dev/Dockerfile
    image: aats-base:dev
    container_name: aats-microstructure-collector
    restart: unless-stopped
    environment:
      AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_LOG_FORMAT: json
      AATS_LOG_LEVEL: INFO
      OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
      OTEL_EXPORTER_PROMETHEUS_PORT: "9465"
      AATS_OTEL_SERVICE_NAME: aats-microstructure-collector
      AATS_PROCESS_ROLE: microstructure-collector
      TZ: Asia/Shanghai
    command: ["python", "scripts/microstructure_ws_daemon.py"]
    expose:
      - "9465"
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/aats_microstructure_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_microstructure_heartbeat))) -lt 60",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
