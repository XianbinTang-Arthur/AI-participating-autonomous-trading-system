# =============================================================================
# AATS 4 进程拓扑 — Stage 5d
#
# 这份 compose 只装 AATS 应用层 4 个服务；基础设施（Postgres/Redis/NATS/Loki/
# Jaeger/Grafana）仍由 deploy/wsl2-dev/docker-compose.yml 提供。两份 compose
# 通过 `name: aats-dev` 共用同一个 project，且都连到 `aats` 网络上。
#
# 启动顺序（以 derivatives 为例）：
#   1) cd deploy/wsl2-dev
#   2) docker compose --env-file .env.wsl2 up -d                          # 基础设施
#   3) docker compose -f docker-compose.aats.yml \
#        -f docker-compose.aats.derivatives.yml \
#        --env-file .env.wsl2 --env-file ../../.env.derivatives build     # 构建
#   4) docker compose -f docker-compose.aats.yml \
#        -f docker-compose.aats.derivatives.yml \
#        --env-file .env.wsl2 --env-file ../../.env.derivatives up -d     # 启动
#
# 关键：--env-file ../../.env.<profile> 让 compose 模板层能读到 AATS_API_PORT
#       等配置项，用于端口映射、uvicorn 命令行参数等。.env.<profile> 是所有
#       运行参数的唯一真相来源，compose 文件不硬编码任何 profile 特定的值。
#
# 设计要点：
#   - 单一镜像 (aats-base) + 不同 command + AATS_PROCESS_ROLE 环境变量
#   - depends_on 走 healthcheck，不靠 sleep；基础设施未就绪不会启动 AATS 进程
#   - 4 个服务都连到 aats 网络（来自 docker-compose.yml 的 networks 段）
#   - 端口、凭证等 profile 特定值全部来自 .env.<profile>，不在 compose 中重复
#   - 资源限制保守，单机 16GB 内存够 4 进程 + 6 个基础设施
# =============================================================================

name: aats-dev

# 复用 docker-compose.yml 创建的网络。external: true 让本文件不会去重复创建。
networks:
  aats:
    name: aats-dev_aats
    external: true

# 4 个服务共享的环境变量片段
x-aats-common-env: &aats-common-env
  # 数据库名 AATS_DB_NAME 来自 .env.<profile>，通过启动命令的
  # --env-file ../../.env.<profile> 注入到 compose 模板层。
  # 4 个环境各自独立：aats_spot / aats_derivatives / aats_live_spot / aats_live_derivatives。
  # 用户名和密码来自 .env.wsl2 的 POSTGRES_USER / POSTGRES_PASSWORD。
  AATS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/${AATS_DB_NAME:-aats}
  AATS_EVENT_BUS_BACKEND: hybrid
  AATS_NATS_URL: nats://nats:4222
  AATS_NATS_STREAM_NAME: AATS_EVENTS
  # Stage 6 Slice 6.1：4 进程拓扑统一走 redis backend 的 hot state store。
  # gateway/market/decision/execution 在 build_runtime 启动期就 ping 真 Redis，
  # 失败立刻抛错（而不是延迟到第一次跨进程读写）。Slice 6.1 范围内尚没有 caller
  # 使用 hot_state_store；本配置先把连接路径打通，给 Slice 6.2/6.3 把 kill_switch
  # 与 portfolio_snapshot 接进 Redis 时铺垫。
  # Active Parameters 从 governance schema 加载，固定指向 aats_research 库。
  # 与 AATS_DATABASE_URL (按 profile 区分) 不同，这条连接只在启动时做一次只读查询。
  AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
  AATS_HOT_STATE_BACKEND: redis
  AATS_HOT_STATE_REDIS_URL: redis://redis:6379/0
  # Stage 8：OpenTelemetry + Jaeger。4 进程共用同一个 OTLP gRPC endpoint，
  # service.name 由 configure_telemetry 根据 AATS_PROCESS_ROLE 自动派生成
  # aats-gateway / aats-market / aats-decision / aats-execution，不需要
  # 在这里逐一复制。sample ratio 保留 1.0 适合 drill/dryrun 阶段；
  # 正式灰度时可降到 0.1。
  # 设计文档：docs/task/stage_8_otel_integration_design.md §D2
  AATS_OTEL_ENDPOINT: http://jaeger:4317
  AATS_OTEL_PROTOCOL: grpc
  AATS_OTEL_DEPLOYMENT_ENV: wsl2-dev
  # 开发阶段 10% 采样足够 drill/debug；全采样会灌满 Jaeger Badger
  # 导致 compaction OOM → restart loop。正式灰度可进一步降到 0.01。
  AATS_OTEL_SAMPLE_RATIO: "0.1"
  AATS_LOG_FORMAT: json
  AATS_LOG_LEVEL: INFO
  TZ: Asia/Shanghai

# 4 个服务共享的资源限制
x-aats-common-resources: &aats-common-resources
  deploy:
    resources:
      limits:
        memory: 1024M

# 4 个服务共享的镜像构建定义（image: 让其他服务复用同一份本地镜像）
x-aats-build: &aats-build
  build:
    context: ../..
    dockerfile: deploy/wsl2-dev/Dockerfile
  image: aats-base:dev


services:
  # ---------------------------------------------------------------------------
  # gateway — FastAPI + UI + REST + 后台 health/admin 任务
  # 是 4 进程拓扑里唯一对外暴露端口的进程；其余 3 个仅内网。
  # ---------------------------------------------------------------------------
  aats-gateway:
    <<: [*aats-build, *aats-common-resources]
    container_name: aats-gateway
    restart: unless-stopped
    environment:
      <<: *aats-common-env
      AATS_PROCESS_ROLE: gateway
    # command 走 scripts/compose_entrypoint.py shim：shim 读 AATS_PROFILE env var
    # 调 load_profiled_dotenv_into_process() 补齐 AATS_STARTUP_PROFILE /
    # AATS_ENV_TEMPLATE_PROFILE 两个派生变量，然后 execvp 到真正的 uvicorn 进程。
    # AATS_PROFILE 由 docker-compose.aats.spot.yml / docker-compose.aats.derivatives.yml
    # override 注入。
    command:
      - "python"
      - "scripts/compose_entrypoint.py"
      - "uvicorn"
      - "apps.api_gateway.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${AATS_API_PORT:-8000}"
      - "--timeout-keep-alive"
      - "120"
    # 端口值来自 .env.<profile> 的 AATS_API_PORT，通过启动命令的
    # --env-file ../../.env.<profile> 注入到 compose 模板插值层。
    # 如果没传 --env-file 则 fallback 到 8000。
    ports:
      - "127.0.0.1:${AATS_API_PORT:-8000}:${AATS_API_PORT:-8000}"
    networks:
      - aats
    # Stage 7 修复：原版用 /system/health，但该 endpoint 在 gateway-only role
    # 下会调到 runtime.market_gateway / execution_adapter (都是 None)，NPE 500。
    # 改用 /healthz —— lightweight liveness，无 auth 无 service 依赖。
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:${AATS_API_PORT:-8000}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # market — 行情拉取 + 特征构造，输出到 NATS hot topics
  # ---------------------------------------------------------------------------
  aats-market:
    <<: [*aats-build, *aats-common-resources]
    container_name: aats-market
    restart: unless-stopped
    environment:
      <<: *aats-common-env
      AATS_PROCESS_ROLE: market
    command: ["python", "scripts/compose_entrypoint.py", "python", "-m", "apps.market_gateway.main"]
    networks:
      - aats
    # Stage 7 修复：3 个 daemon 没有 HTTP listener，靠 process_lifecycle 内的
    # heartbeat task 周期 touch /tmp/aats_<role>_heartbeat。healthcheck 用
    # mtime 与当前时间差 < 30s 来判断进程是否在干活（能区分进程死了 vs 进程
    # hang 住没退出）。30s 阈值给 GIL 阻塞 / 慢 GC / 5s 心跳间隔 + jitter 留 buffer。
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/aats_market_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_market_heartbeat))) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # decision — 订阅市场快照，跑 AI 决策 + 风控，发出 order intents
  # ---------------------------------------------------------------------------
  aats-decision:
    <<: [*aats-build, *aats-common-resources]
    container_name: aats-decision
    restart: unless-stopped
    environment:
      <<: *aats-common-env
      AATS_PROCESS_ROLE: decision
    command: ["python", "scripts/compose_entrypoint.py", "python", "-m", "apps.decision_engine.main"]
    networks:
      - aats
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/aats_decision_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_decision_heartbeat))) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # execution — 订阅 order intents，与 OKX 交互下单，维护 portfolio + reconciliation
  # 资源拨高一档：execution 进程要跑 outbox flush + reconciliation refresh +
  # OKX private WS，是 4 个里最重的。
  # ---------------------------------------------------------------------------
  aats-execution:
    <<: *aats-build
    container_name: aats-execution
    restart: unless-stopped
    environment:
      <<: *aats-common-env
      AATS_PROCESS_ROLE: execution
    command: ["python", "scripts/compose_entrypoint.py", "python", "-m", "apps.execution_engine.main"]
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/aats_execution_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_execution_heartbeat))) -lt 30"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # rdp-daemon — RDP 任务队列轮询执行器
  # 桥接 gateway UI 的按钮操作和实际的 data_maintenance / research_cycle 执行。
  # gateway 把 pending 任务写入 governance.rdp_task_queue 表，daemon 轮询领取
  # 并在容器内执行 workflow（DB 操作 + OKX API 调用，不需要宿主机访问）。
  # 随 docker compose up/down 自动启停，无需手动维护。
  # ---------------------------------------------------------------------------
  aats-rdp-daemon:
    <<: [*aats-build, *aats-common-resources]
    container_name: aats-rdp-daemon
    restart: unless-stopped
    environment:
      <<: *aats-common-env
      AATS_PROCESS_ROLE: rdp-daemon
      # daemon 通过 AATS_ACTIVE_PARAMETER_DB_URL 连接 governance schema
      # （已在 x-aats-common-env 中定义，指向 aats_research）
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
    command: ["python", "scripts/rdp_task_daemon.py", "--poll-interval", "10"]
    networks:
      - aats
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"/tmp/rdp_daemon_alive\") else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
