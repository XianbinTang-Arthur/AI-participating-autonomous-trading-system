# =============================================================================
# Grafana 仪表盘 provider
#
# 把 ./dashboards 目录下的 *.json 自动加载为仪表盘
# 当前是空目录占位，后续阶段会陆续填充：
#   - aats_overview.json     四进程总览
#   - aats_execution.json    执行链时延 / 滑点
#   - aats_decision.json     决策频率 / 拒单率
#   - aats_market.json       行情延迟 / feature 计算耗时
# =============================================================================

apiVersion: 1

providers:
  - name: aats-dev
    orgId: 1
    # Stage 7 修复：Grafana 10.4.4 不允许 folder/folderUid 与
    # foldersFromFilesStructure: true 共存（会报 "should be empty using
    # foldersFromFilesStructure option" 然后整个 grafana 容器 restart-loop）。
    # 我们用 files 目录结构作为 folder 划分依据，所以删掉 folder/folderUid。
    # 后续放仪表盘时按目录组织：files/AATS/overview.json → folder = "AATS"。
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/files
      foldersFromFilesStructure: true
