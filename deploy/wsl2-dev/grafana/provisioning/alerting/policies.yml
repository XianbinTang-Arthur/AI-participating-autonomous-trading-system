# =============================================================================
# Grafana Notification Policies
#
# 默认路由：所有告警走 aats-log-only contact point。
# Stage 9 只在 Grafana UI 内追踪告警状态，不做外部推送。
# =============================================================================

apiVersion: 1

policies:
  - orgId: 1
    receiver: aats-log-only
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
