# =============================================================================
# Grafana Alert Rules — Stage 9 Minimum Viable Alerting
#
# 基于 Stage 9 dryrun checklist §5 的 SEV1-SEV3 定义。
# 全部使用 Loki 数据源（不依赖 Prometheus 即可工作）。
#
# SEV1 = 资金安全，必须立即 halt + 人工干预
# SEV2 = 进程/基础设施异常，15 分钟内处理
# SEV3 = 单次错误，下次审计时 review
#
# 设计文档：docs/task/grafana_audit_fix_design.md §D3
# =============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: AATS Alerts
    folder: AATS
    interval: 1m
    rules:
      # ── SEV1：Kill Switch 触发 ──────────────────────────────────────
      # kill_switch_applied 事件表示系统已自动紧急 halt。
      # 可能原因：reconciliation 不一致、drift score 超阈值、外部干预。
      - uid: sev1-kill-switch
        title: "SEV1: Kill Switch Triggered"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"kill_switch_applied\" [5m]))"
              queryType: range
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev1
        annotations:
          summary: "Kill switch has been triggered — system halted"
          description: "A kill_switch_applied event was detected in the last 5 minutes. Immediate operator intervention required."

      # ── SEV1：Reconciliation 不一致 ─────────────────────────────────
      # 交易所持仓与本地账本不一致，可能存在资金风险。
      - uid: sev1-reconciliation-mismatch
        title: "SEV1: Reconciliation Mismatch"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"reconciliation_mismatch\" [15m]))"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev1
        annotations:
          summary: "Reconciliation mismatch detected — portfolio vs exchange discrepancy"
          description: "One or more reconciliation_mismatch events found in the last 15 minutes."

      # ── SEV2：进程崩溃 ─────────────────────────────────────────────
      # Python Traceback 表示未捕获异常，进程可能已挂。
      # 语义: count > 0 触发 (5 min 内至少 1 次 Traceback = 可能崩溃)
      # 必须走 A→B(reduce:last)→C(math:$B>0) 链,否则 condition: A 会拿到
      # time series → Grafana 告警 DatasourceError "only reduced data can
      # be alerted on" (历史上这条 alert 因此坏过 20h+, 见 2026-04-23 诊断).
      # A 末尾 `or vector(0)`: Loki 无匹配时返回空集,wrap 后保证 A 总有数值
      # 序列(0 或 N), 防止 threshold/math 阶段产生 NoData.
      # C 用 math 而非 threshold: math 总返回 0/1 数值序列,threshold 条件
      # 不满足时会 DROP → NoData → noDataState=Alerting → 健康也误报.
      - uid: sev2-process-crash
        title: "SEV2: Process Crash (Traceback)"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"Traceback\" [5m])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B > 0"
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: sev2
        annotations:
          summary: "Python traceback detected — possible process crash"
          description: "Unhandled exception traceback found in AATS logs."

      # ── SEV2：决策周期停滞 ─────────────────────────────────────────
      # 10 分钟内没有 decision_cycle_completed 日志 = 决策引擎卡死。
      - uid: sev2-decision-stall
        title: "SEV2: Decision Cycle Stall"
        # 语义: count < 1 触发 (10 min 内 0 次 decision_cycle_completed = stall)
        # 必须走 A→B(reduce:last)→C(math:$B<1) 链,否则 condition: A 会变成
        # "有任何命中就 alert" (和 stall 意图相反).
        # A 末尾 `or vector(0)`: Loki 在无匹配时返回空集,wrap 后保证 A always
        # 有数值序列(0 或 N), 防止 threshold/math 阶段产生 NoData 误报.
        # C 用 math 而非 threshold: math 总返回 0/1 数值序列,threshold 在条件
        # 不满足时会 DROP 序列 → NoData → noDataState=Alerting → 健康也误报.
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"decision_cycle_completed\" [10m])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 600
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B < 1"
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "No decision cycles completed in the last 10 minutes"
          description: "Decision engine may be stalled. Check decision process logs."

      # ── SEV3：错误率过高 ────────────────────────────────────────────
      # 15 分钟内超过 5 条 ERROR 级别日志。
      # 使用 reduce → threshold 链：A(Loki count) → B(取末值) → C(>5 判定)
      # A 末尾 `or vector(0)`: 防止 count=0 窗口 Loki 不返回样本导致 reducer:last
      # 读到过去窗口的非零值,在错误已停止的情况下仍然误报.
      - uid: sev3-error-rate
        title: "SEV3: High Error Rate"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", level=\"ERROR\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} [15m])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange:
              from: 0
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
        annotations:
          summary: "More than 5 errors in 15 minutes"
          description: "Elevated error rate detected. Review at next audit."

      # ──────────────────────────────────────────────────────────────
      # P1-D Phase 1A Stage 4: microstructure + Path C Fix 3 告警 (6 条)
      # 对齐 docs/design/p1d_phase1a_implementation_design_2026_04_20.md §4.3
      # 对齐 docs/design/path_c_fix3_monitoring_alerts_followup_2026_04_19.md
      # ──────────────────────────────────────────────────────────────

      # ── 微结构告警 1/3: WS stale ──────────────────────────────────
      # 最近 2 min 未见 microstructure_ws_message 日志 = collector 断链或 daemon 挂
      - uid: sev2-micro-ws-stale
        title: "SEV2: Microstructure WS Stale"
        # A 末尾 `or vector(0)`；D/E 再检查 Prometheus 中是否配置了 collector。
        # 只有 live profile 的 file_sd 存在该 target 时，C 才把日志缺失判为 stale；
        # spot/derivatives 模拟盘未部署 collector，不应产生虚假告警。
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({container=\"aats-microstructure-collector\"} |~ \"flushed [0-9]+/[0-9]+ rows to\" [2m])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 120
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "($B < 1) && ($E > 0)"
            relativeTimeRange: { from: 0, to: 0 }
          - refId: D
            datasourceUid: prometheus
            model:
              # 使用实时服务发现计数，而非 up 序列。后者在 profile 切换后会按
              # Prometheus lookback 窗口残留，导致未部署 collector 的模拟盘误报。
              expr: 'prometheus_sd_discovered_targets{config="aats-microstructure",name="scrape"} or vector(0)'
              queryType: range
            relativeTimeRange:
              from: 120
              to: 0
          - refId: E
            datasourceUid: __expr__
            model:
              type: reduce
              expression: D
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: sev2
          component: microstructure
        annotations:
          summary: "Microstructure WS flush stall (2+ minutes)"
          description: "aats-microstructure-collector has not logged any bronze flush ('flushed N/M rows to ...') in the last 2 min. Check WS disconnection / OKX status / DB availability."

      # ── 微结构告警 2/3: WS 重连频繁 ────────────────────────────────
      # 1h 内 > 5 次 reconnect = OKX 不稳或网络问题
      - uid: sev3-micro-ws-reconnect
        title: "SEV3: Microstructure WS Frequent Reconnect"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({container=\"aats-microstructure-collector\"} |= \"okx_ws_reconnecting\" [1h])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 3600
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
          component: microstructure
        annotations:
          summary: "Microstructure WS reconnect rate > 5/hour"
          description: "Excessive reconnect cycles in the last hour. Likely OKX public WS cluster instability or network saturation. Check okx_ws_disconnected events for root cause."

      # ── 微结构告警 3/3: Silver ETL 耗时过长 ───────────────────────
      # 连续 2 次 Silver ETL duration > 10s = 性能恶化或数据量暴涨
      - uid: sev3-micro-silver-etl-slow
        title: "SEV3: Silver ETL Slow"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "max_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"silver_microstructure_etl\" | regexp \"duration=(?P<duration>[0-9.]+)s\" | unwrap duration [15m])"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: sev3
          component: microstructure
        annotations:
          summary: "Silver ETL duration > 10s (p95 budget exceeded)"
          description: "microstructure silver ETL took >10s. §11 Gate 5 budget breached. Check Bronze 表膨胀 / PG IO / query plan. 对应 dashboard: Panel 3."

      # ── Path C Fix 3 告警 1/3: Fee drift ───────────────────────────
      # 7 天滚动 mean derived_fee_bps > 5.5 bps = 系统成本与 OKX taker 5.0 bps 偏离
      # warning: 5.5 bps, critical: 6.0 bps (Path C Fix 3 设计)
      - uid: sev2-cost-fee-drift
        title: "SEV2: Fee Drift Above Baseline"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "avg_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"fee_drift\" | regexp \"derived_fee_bps=(?P<fee>[0-9.]+)\" | unwrap fee [7d])"
              queryType: range
            relativeTimeRange:
              from: 604800
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5.5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: sev2
          component: cost_audit
        annotations:
          summary: "7d rolling mean derived_fee_bps > 5.5 bps (warning)"
          description: "Execution fee drift detected vs OKX taker 5.0 bps baseline. Threshold breakdown: warning 5.5 / critical 6.0. Check cost_audit_live_reconciliation report §7.2."

      # ── Path C Fix 3 告警 2/3: Cost margin tight ────────────────
      # 单笔 total_entry_cost > max_acceptable_cost_bps × 0.9 (warning)
      # ≥ 0.95 (critical) = 策略成本裕度逼近上限
      # 默认 max_acceptable 7.5 → warning 6.75 / critical 7.125
      - uid: sev2-cost-margin-tight
        title: "SEV2: Cost Margin Tight (single order)"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "max_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"cost_margin_tight\" | regexp \"total_entry_cost_bps=(?P<cost>[0-9.]+)\" | unwrap cost [15m])"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [6.75] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev2
          component: cost_audit
        annotations:
          summary: "Single order total_entry_cost > 6.75 bps (warning)"
          description: "One order exceeded 90% of max_acceptable_cost_bps (7.5). critical @ 7.125. Path C lived max 7.271 — 裕度 0.23 bps。Check cost_audit_live_reconciliation §5.3 + §6.1。"

      # ──────────────────────────────────────────────────────────────
      # 2026-04-20 code review A-H2 fix: telemetry HTTP server dead-man
      # 若 aats-* 的 /metrics endpoint 长时间 scrape 失败, P0-b 所有 metric /
      # alert 自己不可观测 — 闭环漏洞. 用 Prometheus 自带的 `up{}` metric
      # 做 dead-man: scrape UP=1, DOWN=0, absent=missing.
      # ──────────────────────────────────────────────────────────────

      - uid: sev1-metrics-scrape-dead-man
        title: "[SEV-1] aats-* /metrics endpoint long-term DOWN (telemetry dead-man)"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # up{job="aats"} == 0 OR absent 即视为 DOWN.
              # `min_over_time(...[10m]) == 0` 表示 10min 内至少一次 DOWN.
              # `(up == 0) or (absent(up)...)` 合并"target 挂"和"target 配置
              # 但 Prometheus 没采到"两种情形.
              # 必须用 `== bool 0` 返回 0/1 数值（而非按条件过滤序列），
              # 否则 target 健康时表达式返回空向量 → NoData → noDataState=Alerting
              # 反而误报 dead-man。
              expr: |
                (min_over_time(up{job=~"aats|aats-microstructure"}[10m]) == bool 0)
                or on() (absent(up{job=~"aats|aats-microstructure"}) * 0 + 1)
              queryType: range
            relativeTimeRange:
              from: 600
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B > 0.5"
            relativeTimeRange: { from: 0, to: 0 }
        # 配合 `== bool 0` 改写: 表达式现在 always 返回序列(0 或 1),
        # NoData 只在 Prometheus 完全挂掉时发生 — 这时仍应告警.
        # C 用 math 而非 threshold: threshold 在条件不满足时会 DROP 序列,
        # 配合 noDataState=Alerting 会导致健康时误报 dead-man. math 总返回
        # 0/1 数值序列,不产生 NoData,彻底消除这类误报.
        # reducer: last 而非 max: range query 返回 10min 内 21 个采样点,
        # max 会捕捉任一过去时间点的 min_over_time==0(比如 20min 前的短暂 outage),
        # 导致"过去曾经 down 10min+"也触发;我们只关心"当前是否处于 10min 连续 down",
        # last 取最新采样等价于 instant query.
        noDataState: Alerting
        execErrState: Error
        for: 10m
        labels:
          severity: sev1
          component: observability_self
        annotations:
          summary: "aats-* /metrics endpoint 连续 10min DOWN 或 Prometheus target 缺失"
          description: |
            告警触发: 当前部署 profile 配置的主进程或 microstructure-collector
            的 /metrics endpoint 对 Prometheus 不可达.
            影响: P0-b runtime mode badge / Grafana panel / sev2/sev3 alert 全部失效.
            根因候选:
              - telemetry_metrics_http_bind_failed (见 Loki 日志 event_name 同名 critical)
              - 容器 crash loop
              - Prometheus 配置失步 (target 改名但 scrape 未更新)
              - 网络隔离问题
            响应: 立即查 docker logs aats-<service> 和 telemetry_metrics_http_*
            事件; 修复后 `up{}` 回到 1, 告警自动 resolve.
            历史背景: 2026-04-20 首次 deploy 后, scrape 5/6 targets DOWN
            (commit 3c90c64 修完). 本 alert 防再次出现无人发现的 scrape 故障.

      # ──────────────────────────────────────────────────────────────
      # P0-b Task 2.3 Runtime Governance Alerts
      # 对齐 docs/governance/p0b_observability_implementation_spec_2026_04_20.md §2.3
      # 对齐 docs/governance/runtime_trading_mode_semantics.md §4.2
      #
      # 依赖指标 (2026-04-20 deploy 后全部在线):
      #   1. ``aats_runtime_ai_operating_mode_total{mode=...}`` — Task 2.4 代码
      #      (aats/services/decision_engine/target_position.py) ✓ commit ecc6001
      #   2. ``aats_orders_submitted_total{mode=...}`` — order submission 带 mode
      #      label, 由 aats/bootstrap/config.py 两处埋点 ✓ commit 4b2ac2d
      #   3. Prometheus /metrics HTTP server 启动 ✓ commit 3c90c64 (6/6 targets UP)
      #   4. dead-man for items 1-3: sev1-metrics-scrape-dead-man (本文件上方)
      #
      # 每条规则都写 noDataState: OK 避免 "没数据就 fire" 的 false positive.
      # ──────────────────────────────────────────────────────────────

      # 2026-04-23 勘误废弃: `sev2-runtime-baseline-has-orders` 告警已删除.
      # 原假设 "baseline_only 下有 order 提交 = authority_map 被绕过" 与代码实际行为不符:
      #   - `baseline_only` 仅代表不调用 AI 参与决策, 系统仍走完整 baseline → 下单流程
      #   - 执行引擎 (aats/services/execution_engine/, execution_control/) 不检查 decision_authority
      #   - baseline 驱动的下单是合法的, 告警会持续误报
      # 见 docs/governance/runtime_trading_mode_semantics.md §8 修订记录.
      # `aats_orders_submitted_total{mode=...}` 指标本身保留, sev3 仍需要.

      - uid: sev3-runtime-ai-decision-no-orders
        title: "[SEV-3] ai_decision_maker 模式下 24h 内 0 订单"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            # 2026-04-20 code review 修:
            # 原表达式 `sum(rate(...)) + 1 / clamp_min(...)` Prom operator 优先级
            #   解析为 A + (1/B), 不是 (A+1)/B.
            # Counter `aats_runtime_ai_operating_mode_total` 单调递增, 1/B 只有
            #   B > 10000 时才跌破 0.0001 阈值 (decision ~15s/次 ≈ 1.74 day),
            #   意味着实际告警延迟 ~2 天 + `for: 24h` = 3+ 天, 与"24h 零订单"
            #   设计意图不符.
            # 新表达式: 用 `and on()` 子句门控 — 仅当 ai_decision_maker mode 活
            #   跃 (最近 5min 有 decision_outcome emit, rate>0) AND 24h 零订单
            #   才触发. 保持分母非零但不污染分子.
            # 2026-04-20 修: expr/queryType 之前未缩进到 model:, 导致
            #   queryV1.Model.Raw=nil -> json.Marshal=null -> Grafana 解码后
            #   modelProps=nil -> setMaxDatapoints 往 nil map 写入 panic.
            model:
              expr: |
                (sum(rate(aats_orders_submitted_total{mode="ai_decision_maker"}[24h])) == 0)
                and on()
                (sum(rate(aats_runtime_ai_operating_mode_total{mode="ai_decision_maker"}[5m])) > 0)
                or on() vector(0)
              queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              # 2026-04-20 修: 新 expr 返回 1 (触发) / 0 (不触发); gt 0.5 即可区分
              conditions:
                - evaluator: { type: gt, params: [0.5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 24h
        labels:
          severity: sev3
          component: runtime_governance
        annotations:
          summary: "ai_decision_maker mode 跑了 24h 但零订单 — alpha/cost 可能阻断"
          description: |
            spec: docs/governance/p0b_observability_implementation_spec_2026_04_20.md §2.3
            ai_decision_maker 模式应当产生真实订单. 24h 零订单通常意味着:
              - alpha signal 全部被 threshold/cost guard 过滤
              - 或 decision_outcome 流在下游某处被卡住
            依赖指标: aats_orders_submitted_total{mode="ai_decision_maker"} + aats_runtime_ai_operating_mode_total{mode="ai_decision_maker"}.
            非告警 = 真的有一张单在这个周期内提交, 或者根本不在 ai_decision_maker 模式下.
            响应: 核对 latest decision_outcome / execution suggestion / blockers.

      # ── Path C Fix 3 告警 3/3: BLOCKED close-only race ──────────
      # 24h 内 cancel_reason='okx_close_only_without_reducible_position'
      # >= 2 (warning) / >= 5 (critical) = close_only 判定 vs 实际仓位 race
      - uid: sev3-blocked-close-only-race
        title: "SEV3: BLOCKED close_only race condition"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |~ \"okx_close_only_without_reducible_position\" [24h])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
          component: execution
        annotations:
          summary: "24h >=2 BLOCKED orders with close_only race"
          description: "cancel_reason=okx_close_only_without_reducible_position fired >=2 times in 24h (critical @ 5). Suspected race between close_only check and live position read. Check cost_audit_live_reconciliation §2.4 + §10 疑问 4。"

      # ── OKX 持续限流告警 ──────────────────────────────────────────
      # P-B 修复后, okx_rate_limited_backoff 是 WARNING 级 "退避了,没事"信号,
      # 单次/少量出现属于 OKX 公共端点限流 → 动态退避, 系统自愈, 不需人介入.
      # 但如果 1h 内 > 6 次, 意味着:
      #   - OKX 公共端点持续限流 (我们下游动作过于激进, 可能把 refresh_interval
      #     压得太低, 或 instrument universe 扩张导致调用量上升)
      #   - 或 retry_after_seconds 被 OKX 拉长, 退避不足以避免下一周期命中
      # 任何一种都需要 operator 介入调查. 6/hour 阈值 = 平均每 10min 一次限流,
      # 明显高于正常值 (稳态下 24h 应 <=1 次).
      - uid: sev3-okx-rate-limited-persistent
        title: "SEV3: OKX Rate Limit Persistent"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", container=~\"aats-gateway|aats-market|aats-decision|aats-execution|aats-rdp-daemon|aats-microstructure-collector\"} |= \"okx_rate_limited_backoff\" [1h])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 3600
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [6] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
          component: execution
        annotations:
          summary: "OKX rate limit backoff > 6 events / hour"
          description: "okx_rate_limited_backoff 1h 内触发 > 6 次. 单次退避属于正常自愈 (P-B), 高频说明 OKX 公共端点持续限流. 排查方向: (1) _cached_aux_payload refresh_interval 是否过短; (2) instrument universe 是否扩大; (3) OKX Retry-After 是否被延长. 对应 log event: okx_rate_limited_backoff (WARNING)."

      # ── Candles 15m Rolling 数据采集失活 ─────────────────────────────
      # candles_rolling_15m 工作流每 15min 跑一次, 每次给 4 个 symbol
      # (BTC-USDT, ETH-USDT, BTC-USDT-SWAP, ETH-USDT-SWAP) 拉 15m K 线增量,
      # 完成时 rdp_daily_ingest 打 "[1/4] Candles done: 4 ok, 0 failed".
      # 30min 窗口期望 >= 2 次 (每 15min 1 次). < 2 即采集卡住或全部失败,
      # research phase 0 OHLC 对照基线会过期, microstructure silver 失去 peer.
      # 用 math '$B < 2' + noDataState=Alerting 模式 (commit 7950b7c 破 threshold-drop 陷阱).
      - uid: sev3-candles-15m-stale
        title: "SEV3: Candles 15m Rolling Stale"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({container=\"aats-rdp-daemon\"} |= \"[1/4] Candles done\" [30m])) or vector(0)"
              queryType: range
            relativeTimeRange:
              from: 1800
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B < 2"
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: sev3
          component: rdp
        annotations:
          summary: "candles_rolling_15m: 30min 内 < 2 次完整 cycle (期望 >= 2)"
          description: "candles_rolling_15m 工作流 30min 内 [1/4] Candles done 标记 < 2 次, 即 BTC/ETH spot+swap 15m K 线增量采集失活. 排查: (1) docker logs aats-rdp-daemon | grep candles_rolling_15m; (2) PG governance.rdp_task_queue WHERE workflow='candles_rolling_15m' AND requested_at > now() - interval '1 hour' (查 status); (3) OKX REST 是否限流 (sev3-okx-rate-limited-persistent 是否同时触发); (4) merge_pipeline.ValidationBlockedError 是否频发."
