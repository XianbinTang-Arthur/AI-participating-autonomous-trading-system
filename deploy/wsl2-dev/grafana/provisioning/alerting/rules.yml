# =============================================================================
# Grafana Alert Rules — Stage 9 Minimum Viable Alerting
#
# 基于 Stage 9 dryrun checklist §5 的 SEV1-SEV3 定义。
# 全部使用 Loki 数据源（不依赖 Prometheus 即可工作）。
#
# SEV1 = 资金安全，必须立即 halt + 人工干预
# SEV2 = 进程/基础设施异常，15 分钟内处理
# SEV3 = 单次错误，下次审计时 review
#
# 设计文档：docs/task/grafana_audit_fix_design.md §D3
# =============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: AATS Alerts
    folder: AATS
    interval: 1m
    rules:
      # ── SEV1：Kill Switch 触发 ──────────────────────────────────────
      # kill_switch_applied 事件表示系统已自动紧急 halt。
      # 可能原因：reconciliation 不一致、drift score 超阈值、外部干预。
      - uid: sev1-kill-switch
        title: "SEV1: Kill Switch Triggered"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\"} |= \"kill_switch_applied\" [5m]))"
              queryType: range
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev1
        annotations:
          summary: "Kill switch has been triggered — system halted"
          description: "A kill_switch_applied event was detected in the last 5 minutes. Immediate operator intervention required."

      # ── SEV1：Reconciliation 不一致 ─────────────────────────────────
      # 交易所持仓与本地账本不一致，可能存在资金风险。
      - uid: sev1-reconciliation-mismatch
        title: "SEV1: Reconciliation Mismatch"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\"} |= \"reconciliation_mismatch\" [15m]))"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev1
        annotations:
          summary: "Reconciliation mismatch detected — portfolio vs exchange discrepancy"
          description: "One or more reconciliation_mismatch events found in the last 15 minutes."

      # ── SEV2：进程崩溃 ─────────────────────────────────────────────
      # Python Traceback 表示未捕获异常，进程可能已挂。
      - uid: sev2-process-crash
        title: "SEV2: Process Crash (Traceback)"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\"} |= \"Traceback\" [5m]))"
              queryType: range
            relativeTimeRange:
              from: 300
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev2
        annotations:
          summary: "Python traceback detected — possible process crash"
          description: "Unhandled exception traceback found in AATS logs."

      # ── SEV2：决策周期停滞 ─────────────────────────────────────────
      # 10 分钟内没有 decision_cycle_completed 日志 = 决策引擎卡死。
      - uid: sev2-decision-stall
        title: "SEV2: Decision Cycle Stall"
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\"} |= \"decision_cycle_completed\" [10m]))"
              queryType: range
            relativeTimeRange:
              from: 600
              to: 0
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: sev2
        annotations:
          summary: "No decision cycles completed in the last 10 minutes"
          description: "Decision engine may be stalled. Check decision process logs."

      # ── SEV3：错误率过高 ────────────────────────────────────────────
      # 15 分钟内超过 5 条 ERROR 级别日志。
      # 使用 reduce → threshold 链：A(Loki count) → B(取末值) → C(>5 判定)
      - uid: sev3-error-rate
        title: "SEV3: High Error Rate"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\", level=\"ERROR\"} [15m]))"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange:
              from: 0
              to: 0
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
            relativeTimeRange:
              from: 0
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
        annotations:
          summary: "More than 5 errors in 15 minutes"
          description: "Elevated error rate detected. Review at next audit."

      # ──────────────────────────────────────────────────────────────
      # P1-D Phase 1A Stage 4: microstructure + Path C Fix 3 告警 (6 条)
      # 对齐 docs/design/p1d_phase1a_implementation_design_2026_04_20.md §4.3
      # 对齐 docs/design/path_c_fix3_monitoring_alerts_followup_2026_04_19.md
      # ──────────────────────────────────────────────────────────────

      # ── 微结构告警 1/3: WS stale ──────────────────────────────────
      # 最近 2 min 未见 microstructure_ws_message 日志 = collector 断链或 daemon 挂
      - uid: sev2-micro-ws-stale
        title: "SEV2: Microstructure WS Stale"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({container=\"aats-microstructure-collector\"} |= \"okx_ws_message_received\" [2m]))"
              queryType: range
            relativeTimeRange:
              from: 120
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels:
          severity: sev2
          component: microstructure
        annotations:
          summary: "Microstructure WS no messages for 2+ minutes"
          description: "aats-microstructure-collector has not logged okx_ws_message_received in the last 2 min. Check WS disconnection / OKX status / DB availability."

      # ── 微结构告警 2/3: WS 重连频繁 ────────────────────────────────
      # 1h 内 > 5 次 reconnect = OKX 不稳或网络问题
      - uid: sev3-micro-ws-reconnect
        title: "SEV3: Microstructure WS Frequent Reconnect"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({container=\"aats-microstructure-collector\"} |= \"okx_ws_reconnecting\" [1h]))"
              queryType: range
            relativeTimeRange:
              from: 3600
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
          component: microstructure
        annotations:
          summary: "Microstructure WS reconnect rate > 5/hour"
          description: "Excessive reconnect cycles in the last hour. Likely OKX public WS cluster instability or network saturation. Check okx_ws_disconnected events for root cause."

      # ── 微结构告警 3/3: Silver ETL 耗时过长 ───────────────────────
      # 连续 2 次 Silver ETL duration > 10s = 性能恶化或数据量暴涨
      - uid: sev3-micro-silver-etl-slow
        title: "SEV3: Silver ETL Slow"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "max_over_time({job=\"aats\"} |= \"silver_microstructure_etl\" | regexp \"duration=(?P<duration>[0-9.]+)s\" | unwrap duration [15m])"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: sev3
          component: microstructure
        annotations:
          summary: "Silver ETL duration > 10s (p95 budget exceeded)"
          description: "microstructure silver ETL took >10s. §11 Gate 5 budget breached. Check Bronze 表膨胀 / PG IO / query plan. 对应 dashboard: Panel 3."

      # ── Path C Fix 3 告警 1/3: Fee drift ───────────────────────────
      # 7 天滚动 mean derived_fee_bps > 5.5 bps = 系统成本与 OKX taker 5.0 bps 偏离
      # warning: 5.5 bps, critical: 6.0 bps (Path C Fix 3 设计)
      - uid: sev2-cost-fee-drift
        title: "SEV2: Fee Drift Above Baseline"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "avg_over_time({job=\"aats\"} |= \"fee_drift\" | regexp \"derived_fee_bps=(?P<fee>[0-9.]+)\" | unwrap fee [7d])"
              queryType: range
            relativeTimeRange:
              from: 604800
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5.5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: sev2
          component: cost_audit
        annotations:
          summary: "7d rolling mean derived_fee_bps > 5.5 bps (warning)"
          description: "Execution fee drift detected vs OKX taker 5.0 bps baseline. Threshold breakdown: warning 5.5 / critical 6.0. Check cost_audit_live_reconciliation report §7.2."

      # ── Path C Fix 3 告警 2/3: Cost margin tight ────────────────
      # 单笔 total_entry_cost > max_acceptable_cost_bps × 0.9 (warning)
      # ≥ 0.95 (critical) = 策略成本裕度逼近上限
      # 默认 max_acceptable 7.5 → warning 6.75 / critical 7.125
      - uid: sev2-cost-margin-tight
        title: "SEV2: Cost Margin Tight (single order)"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "max_over_time({job=\"aats\"} |= \"cost_margin_tight\" | regexp \"total_entry_cost_bps=(?P<cost>[0-9.]+)\" | unwrap cost [15m])"
              queryType: range
            relativeTimeRange:
              from: 900
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [6.75] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev2
          component: cost_audit
        annotations:
          summary: "Single order total_entry_cost > 6.75 bps (warning)"
          description: "One order exceeded 90% of max_acceptable_cost_bps (7.5). critical @ 7.125. Path C lived max 7.271 — 裕度 0.23 bps。Check cost_audit_live_reconciliation §5.3 + §6.1。"

      # ──────────────────────────────────────────────────────────────
      # P0-b Task 2.3 Runtime Governance Alerts
      # 对齐 docs/governance/p0b_observability_implementation_spec_2026_04_20.md §2.3
      # 对齐 docs/governance/runtime_trading_mode_semantics.md §4.2
      #
      # 依赖指标 (2026-04-20 deploy 后全部在线):
      #   1. ``aats_runtime_ai_operating_mode_total{mode=...}`` — Task 2.4 代码
      #      (aats/services/decision_engine/target_position.py) ✓ commit ecc6001
      #   2. ``aats_orders_submitted_total{mode=...}`` — order submission 带 mode
      #      label, 由 aats/bootstrap/config.py 两处埋点 ✓ commit 4b2ac2d
      #   3. Prometheus /metrics HTTP server 启动 ✓ commit 3c90c64 (6/6 targets UP)
      #
      # 每条规则都写 noDataState: OK 避免 "没数据就 fire" 的 false positive.
      # ──────────────────────────────────────────────────────────────

      - uid: sev2-runtime-baseline-has-orders
        title: "[SEV-2] baseline_only 模式下不应有订单提交"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "sum(rate(aats_orders_submitted_total{mode=\"baseline_only\"}[24h]))"
              instant: false
              queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: sev2
          component: runtime_governance
        annotations:
          summary: "baseline_only mode 下 24h 内检测到订单提交 — authority_map 可能被绕过"
          description: |
            spec: docs/governance/p0b_observability_implementation_spec_2026_04_20.md §2.3
            在 ai_operating_mode=baseline_only 下, decision_authority 固定为
            reference_only, 任何订单提交都违反 governance (见 runtime_trading_mode_semantics.md §1).
            依赖指标: aats_orders_submitted_total{mode="baseline_only"} (已由 commit 4b2ac2d 接入 mode label).
            响应: 立即 halt + reconciliation + 审查 authority_map 逻辑 (target_position.py:1926).

      - uid: sev3-runtime-ai-decision-no-orders
        title: "[SEV-3] ai_decision_maker 模式下 24h 内 0 订单"
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            # 2026-04-20 code review 修:
            # 原表达式 `sum(rate(...)) + 1 / clamp_min(...)` Prom operator 优先级
            #   解析为 A + (1/B), 不是 (A+1)/B.
            # Counter `aats_runtime_ai_operating_mode_total` 单调递增, 1/B 只有
            #   B > 10000 时才跌破 0.0001 阈值 (decision ~15s/次 ≈ 1.74 day),
            #   意味着实际告警延迟 ~2 天 + `for: 24h` = 3+ 天, 与"24h 零订单"
            #   设计意图不符.
            # 新表达式: 用 `and on()` 子句门控 — 仅当 ai_decision_maker mode 活
            #   跃 (最近 5min 有 decision_outcome emit, rate>0) AND 24h 零订单
            #   才触发. 保持分母非零但不污染分子.
            expr: |
              (sum(rate(aats_orders_submitted_total{mode="ai_decision_maker"}[24h])) == 0)
              and on()
              (sum(rate(aats_runtime_ai_operating_mode_total{mode="ai_decision_maker"}[5m])) > 0)
              or on() vector(0)
            queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              # 2026-04-20 修: 新 expr 返回 1 (触发) / 0 (不触发); gt 0.5 即可区分
              conditions:
                - evaluator: { type: gt, params: [0.5] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 24h
        labels:
          severity: sev3
          component: runtime_governance
        annotations:
          summary: "ai_decision_maker mode 跑了 24h 但零订单 — alpha/cost 可能阻断"
          description: |
            spec: docs/governance/p0b_observability_implementation_spec_2026_04_20.md §2.3
            ai_decision_maker 模式应当产生真实订单. 24h 零订单通常意味着:
              - alpha signal 全部被 threshold/cost guard 过滤
              - 或 decision_outcome 流在下游某处被卡住
            依赖指标: aats_orders_submitted_total{mode="ai_decision_maker"} + aats_runtime_ai_operating_mode_total{mode="ai_decision_maker"}.
            非告警 = 真的有一张单在这个周期内提交, 或者根本不在 ai_decision_maker 模式下.
            响应: 核对 latest decision_outcome / execution suggestion / blockers.

      # ── Path C Fix 3 告警 3/3: BLOCKED close-only race ──────────
      # 24h 内 cancel_reason='okx_close_only_without_reducible_position'
      # >= 2 (warning) / >= 5 (critical) = close_only 判定 vs 实际仓位 race
      - uid: sev3-blocked-close-only-race
        title: "SEV3: BLOCKED close_only race condition"
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: "sum(count_over_time({job=\"aats\"} |~ \"okx_close_only_without_reducible_position\" [24h]))"
              queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
            relativeTimeRange: { from: 0, to: 0 }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
            relativeTimeRange: { from: 0, to: 0 }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: sev3
          component: execution
        annotations:
          summary: "24h >=2 BLOCKED orders with close_only race"
          description: "cancel_reason=okx_close_only_without_reducible_position fired >=2 times in 24h (critical @ 5). Suspected race between close_only check and live position read. Check cost_audit_live_reconciliation §2.4 + §10 疑问 4。"
