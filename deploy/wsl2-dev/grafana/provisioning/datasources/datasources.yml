# =============================================================================
# Grafana 数据源 — 自动 provision
#
# Loki / Jaeger / Postgres 三个数据源开箱可用
# Postgres 数据源使用 Grafana 内置 driver，可直接 SQL 查询 AATS 表
# =============================================================================

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id": "([a-f0-9]*[1-9a-f][a-f0-9]*)"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: aats.process_role
            value: process_role
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job="aats"} | json | trace_id=`$${__span.traceId}`'

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    jsonData:
      httpMethod: GET
      prometheusType: Prometheus
      timeInterval: "30s"

  # 2026-04-20 code review Issue 5a fix:
  # 原配置 database=$POSTGRES_DB (= "aats", 空库) 导致所有 SQL panel 看不到
  # 数据. AATS 实际数据分 2 个库:
  #   - aats_live_derivatives: public.event_store / decision_outcome / 运维
  #   - aats_research:         bronze.* / silver.* / gold.* (data platform)
  # Grafana Postgres driver 一个 datasource 只能连 1 个 DB, 所以分开配.
  - name: Postgres
    uid: postgres
    type: postgres
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      # 用于 AATS Operations 的 event_store / runtime mode fallback / pg_stat_activity 查询
      database: aats_live_derivatives
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true

  - name: Postgres Research
    uid: postgres_research
    type: postgres
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      # 用于 P1-D Microstructure dashboard 查 bronze.* / silver.* / gold.* / staging.*
      database: aats_research
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
