# =============================================================================
# Grafana 数据源 — 自动 provision
#
# Loki / Jaeger / Postgres 三个数据源开箱可用
# Postgres 数据源使用 Grafana 内置 driver，可直接 SQL 查询 AATS 表
# =============================================================================

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id": "([a-f0-9]*[1-9a-f][a-f0-9]*)"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: aats.process_role
            value: process_role
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job="aats"} | json | trace_id=`$${__span.traceId}`'

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    jsonData:
      httpMethod: GET
      prometheusType: Prometheus
      timeInterval: "30s"

  - name: Postgres
    uid: postgres
    type: postgres
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
