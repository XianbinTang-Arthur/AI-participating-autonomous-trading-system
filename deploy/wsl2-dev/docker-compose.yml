# =============================================================================
# AATS WSL2 本地基础设施 — 多进程切片化重构 Stage 1
#
# 目标：在 WSL2 (Ubuntu) 上一键拉起 AATS 4 进程架构所需的全部依赖
#       Postgres / Redis / NATS JetStream / Loki / Jaeger / Grafana
#
# 设计原则：
#   - 全部本地、零云费用
#   - 仅监听 127.0.0.1，避免局域网/外网泄露
#   - 持久化卷使用 docker named volume，便于 docker volume ls 管理
#   - 资源限制按 32GB 开发机实测 docker stats 调优（2026-04 优化）
#
# 运维入口：只允许从仓库根执行 scripts/deploy.sh --profile <spot|derivatives> --skip-commit。
# 本文件是标准部署脚本管理的基础设施实现细节，不是独立启动/停止/清理入口；不得手工执行
# docker compose，尤其不得对持久化卷执行 down -v。参见 DEPLOYMENT.md。
# =============================================================================

name: aats-dev

networks:
  aats:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:
  loki_data:
  grafana_data:
  jaeger_badger_data:
  prometheus_data:
  promtail_positions:

services:
  # ---------------------------------------------------------------------------
  # Postgres 16 — AATS 主存储
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aats}
      POSTGRES_USER: ${POSTGRES_USER:-aats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aats}
      # 设置时区与服务器一致，方便排查
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"          # FS-008 单一预算：声明池上限 150 + 普通连接余量 47
      - "-c"
      - "superuser_reserved_connections=3"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "checkpoint_timeout=10min"
      - "-c"
      - "log_min_duration_statement=500"  # 慢查询 >500ms 入日志
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次初始化时自动创建 4 个环境隔离数据库 + 1 个 RDP 研究库
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 同时指定用户和实际存在的基础库。只传 -U 时 pg_isready 会默认连接
      # 与用户名同名的数据库；例如 POSTGRES_USER=admin 会每 10 秒向日志写入
      # `FATAL: database \"admin\" does not exist`，即使容器最终仍被判 healthy。
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 2560M

  # ---------------------------------------------------------------------------
  # Redis 7 — 跨进程热状态缓存（仓位/订单视图）
  # AOF 持久化，避免 crash 后状态丢失
  #
  # 安全加固（2026-04）：
  #   - 启用 requirepass 认证，密码从 .env.wsl2 REDIS_PASSWORD 读取
  #   - 仅监听 127.0.0.1，局域网不可达
  #   - TLS：本地开发不启用；生产环境可用 stunnel 或 Redis 原生 TLS
  #     （需额外 --tls-port / --tls-cert-file / --tls-key-file 参数）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aats-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "384mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD:-changeme}"
    # REDISCLI_AUTH 环境变量让 redis-cli 自动认证，避免 -a 参数把密码
    # 泄漏到 healthcheck 命令行（docker inspect 可见）。
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis Exporter — Redis 指标采集 → Prometheus
  # 暴露 redis_commands_duration_seconds_total 等指标供 Grafana 延迟面板使用
  # Stage 9 §3.1 要求：Redis latency p99 < 10ms
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0-alpine@sha256:f8b9ce3393afb619696f43e000c93369258109b0ea82a37ba4d29d000c277f2f
    container_name: aats-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9121/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # NATS JetStream — 跨进程事件总线
  # critical topic 用 file storage（持久化、宕机不丢）
  # observer topic 用 memory storage（流量大、可丢、不阻塞主路径）
  # 这里 server 同时支持两种 storage，由 stream 配置决定
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: aats-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # http monitoring
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # Loki — 集中日志存储
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0@sha256:757b5fadf816a1396f1fea598152947421fa49cb8b2db1ddd2a6e30fae003253
    container_name: aats-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Jaeger All-in-One — 分布式 trace 收集与查询
  # 使用 Badger 内嵌存储，开发足够
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    container_name: aats-jaeger
    restart: unless-stopped
    # ── 权限处理 ──────────────────────────────────────────────────
    # Jaeger 镜像默认以 uid 10001 运行（USER 10001），但 Docker named
    # volume 首次创建时属 root:root，uid 10001 无法在其中建子目录。
    #
    # 方案：以 root 启动 → entrypoint 修权限 → su 降回 uid 10001 →
    # exec 主进程。Badger 写出的文件全部属 10001:10001，将来去掉
    # user: "0" 或升级 Jaeger 2.x 都不会因文件属主错位而 crash。
    #
    # 注意：Jaeger 镜像 /etc/passwd 中没有 uid 10001 对应的用户名，
    # BusyBox su 需要用户名，所以 entrypoint 先 adduser 再 su。
    user: "0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        adduser -D -u 10001 -H jaeger 2>/dev/null || true
        mkdir -p /badger/data /badger/key
        chown -R 10001:10001 /badger
        exec su -s /bin/sh jaeger -c '/go/bin/all-in-one-linux'
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "badger"
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: "/badger/data"
      BADGER_DIRECTORY_KEY: "/badger/key"
      # span 保留 48 小时；Badger SST 表过多会在启动时撑爆内存
      BADGER_SPAN_STORE_TTL: "48h"
      # 限制 Go runtime 线程数，减少内存占用（宿主 16 核 → 容器只需 2）
      GOMAXPROCS: "2"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC（AATS 4 进程都打到这里）
      - "127.0.0.1:4318:4318"     # OTLP HTTP
    volumes:
      # 2026-04-12: bind mount (./jaeger/badger) → named volume。
      # bind mount 会在项目源码树内创建宿主机无权读取的目录
      #（drwx------ 10001:root），导致 Docker build context stat 失败。
      # named volume 由 Docker 管理，数据不在源码树内。
      - jaeger_badger_data:/badger
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # Prometheus — AATS 进程指标采集
  # 采集 4 个 AATS 容器的 PrometheusMetricReader (:9464) 端点
  # Grafana Prometheus datasource 指向此处
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
    container_name: aats-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=48h"
      - "--web.listen-address=0.0.0.0:9090"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 默认 spot/derivatives 模拟 profile 采用四切片主进程且不启动
      # microstructure collector。live/monolith overlay 按容器目标路径替换
      # 这两个 file_sd 文件，避免 Prometheus 对未部署服务持续报 DOWN。
      - ./prometheus/targets/aats-sliced.yml:/etc/prometheus/targets/aats.yml:ro
      - ./prometheus/targets/empty.yml:/etc/prometheus/targets/microstructure.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Grafana — 一站式 Loki + Jaeger + Postgres + Prometheus 仪表盘
  # 数据源已在 ./grafana/provisioning 里自动配置
  # ---------------------------------------------------------------------------
  grafana:
    # 10.4.4 在 provisioning 加载 rules.yml (含 __expr__ server-side expression stage) 时
    # setMaxDatapoints 对 nil modelProps map 写入 panic,导致容器无限 Restart。
    # 12.4.0 的 PR #115239 给 setModelProps 加了 aq.Model == nil 的保护,
    # 升级到 12.4.3 (最新补丁版) 修复该 panic 并恢复 17 条告警规则。
    image: grafana/grafana:12.4.3@sha256:2e986801428cd689c2358605289c90ab37d2b39e24808874971f54c99bcdc412
    container_name: aats-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      # Postgres 数据源 provisioning 需要这些变量做环境变量展开
      POSTGRES_DB: ${POSTGRES_DB:-aats}
      POSTGRES_USER: ${POSTGRES_USER:-aats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aats}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Promtail — Docker 容器日志采集器 → Loki
  # 从 /var/lib/docker/containers 读 json-file 日志，解析后推送 Loki
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0@sha256:d3de3da9431cfbe74a6a94555050df5257f357e827be8e63f8998d509c37af8b
    container_name: aats-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
      - "-config.expand-env=true"
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/localhost/9080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 256M
