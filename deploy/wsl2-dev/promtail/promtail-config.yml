# =============================================================================
# AATS Promtail — Docker 容器日志采集 → Loki
#
# 通过 Docker Socket 服务发现自动采集 aats-* 容器日志：
#   - 自动提取 container 名称（如 aats-gateway、aats-postgres）
#   - 解析 AATS JSON 结构化日志，提取 level / process_role 作为 Loki label
#   - 支持 Grafana LogQL 按字段过滤和 trace 跳转
#
# 设计原则：
#   - 零侵入：不改应用代码的日志输出路径，从 Docker 日志文件被动采集
#   - Docker SD：通过 Docker Socket 发现容器，自动获取可读容器名
#   - 结构化优先：AATS 输出 JSON 日志时自动解析；纯文本日志也能采集
#   - label 精简：container / level / process_role 三个索引 label
#     高基数字段（trace_id / event_name）走正文搜索或 Grafana derived field
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  # ── Docker 容器日志（自动发现） ─────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # 只采集 aats-* 容器，排除宿主机上的非项目容器
      - source_labels: ['__meta_docker_container_name']
        regex: '/aats-.*'
        action: keep
      # 容器名：Docker 返回 /aats-gateway，去掉前缀 /
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # 统一 job label
      - action: replace
        replacement: aats
        target_label: 'job'

    pipeline_stages:
      # Step 1: Docker json-file driver 的外层 JSON
      # {"log":"...","stream":"stdout","time":"2026-..."}
      - docker: {}

      # Step 2: 尝试将 log 内容解析为 JSON（AATS JSON 格式日志）
      # 非 JSON 日志（基础设施容器）json stage 解析失败会静默跳过
      - json:
          expressions:
            level: level
            process_role: process_role

      # Step 3: 将解析出的低基数字段提升为 Loki label
      - labels:
          level:
          process_role:
