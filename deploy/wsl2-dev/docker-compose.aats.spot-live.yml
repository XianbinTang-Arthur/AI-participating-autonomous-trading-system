# =============================================================================
# AATS 4 进程 — OKX 现货实盘 override
#
# 用途：在 docker-compose.aats.yml 基础上叠加 .env.spot.live 凭证文件 + 设置
#       AATS_PROFILE=spot_live，让 base compose 里的 scripts/compose_entrypoint.py
#       shim 在每个进程启动前调 load_profiled_dotenv_into_process() 注入
#       AATS_STARTUP_PROFILE / AATS_ENV_TEMPLATE_PROFILE 两个派生变量，
#       走 managed profile spot_live runtime_defaults 分支。
#
# 与 spot 模拟盘的区别：
#   - 凭证文件：.env.spot.live（真实 API key，非模拟盘）
#   - AATS_PROFILE：spot_live（真实交易模式，okx_simulated_trading=False）
#   - 启用 trial guard（严格止损，日亏限额 20 USDT）
#
# 启动方式（在 deploy/wsl2-dev/ 目录下）：
#   docker compose \
#     -f docker-compose.aats.yml \
#     -f docker-compose.aats.spot-live.yml \
#     --env-file ../../.env.wsl2 \
#     --env-file ../../.env.spot.live \
#     up -d
# =============================================================================

name: aats-dev

# spot_live managed profile hint
x-aats-spot-live-env: &aats-spot-live-env
  AATS_PROFILE: spot_live

services:
  aats-gateway:
    env_file:
      - ../../.env.spot.live
    environment:
      <<: *aats-spot-live-env

  aats-market:
    env_file:
      - ../../.env.spot.live
    environment:
      <<: *aats-spot-live-env

  aats-decision:
    env_file:
      - ../../.env.spot.live
    environment:
      <<: *aats-spot-live-env

  aats-execution:
    env_file:
      - ../../.env.spot.live
    environment:
      <<: *aats-spot-live-env

  aats-rdp-daemon:
    env_file:
      - ../../.env.spot.live
    environment:
      <<: *aats-spot-live-env
      AATS_PROCESS_ROLE: rdp-daemon
