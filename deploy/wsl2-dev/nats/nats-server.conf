# =============================================================================
# AATS NATS JetStream — 单节点开发配置
#
# 说明：
#   - 单节点足够开发用；后续如需高可用可改成 3 节点 cluster
#   - JetStream 同时启用 file 和 memory storage；具体每条 stream 用哪种由
#     stream 创建时指定（critical topic 用 file，observer topic 用 memory）
#   - 限额是开发上限，避免单机内存被写爆
# =============================================================================

server_name: aats-nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# JetStream 配置
jetstream {
  store_dir: "/data/jetstream"

  # 文件存储上限：8GB（slice nats-capacity §8.1）
  #
  # 当前容量预算对账：
  #   AATS_EVENTS_MARKET.max_bytes   = 2.0 GB  (limits / 1 天 / 高频 snapshots)
  #   AATS_EVENTS.max_bytes          = 4.0 GB  (interest / 1 天 fallback)
  #   AATS_EVENTS_COMMANDS.max_bytes = 0.5 GB  (limits / 1 天 / 交易指令)
  #   三条 stream max_bytes 合计      = 6.5 GB
  #   max_file_store (本字段)        =  8 GB
  #   headroom                       = 1.5 GB  (约 19%，留给 index / consumer state /
  #                                            nats server 内部元数据)
  #
  # 病根修复：原值 1 GB 太小且早期单 stream 没有字节上限，高频写入会撞
  # server 硬限。现在使用 8 GB server 上限 + 3 条 StreamSpec 字节软刹车。
  #
  # 单元测试 test_total_stream_capacity_within_server_budget 锁死三条 stream 的
  # 总预算不超过 server 的安全比例，防止只改 StreamSpec 不更新本文件。
  max_file_store: 8GB

  # 内存存储上限：256MB（observer topic 总和）
  max_memory_store: 256MB
}

# 系统级账户（可选；用于 NATS 内置监控）
# accounts {
#   $SYS {
#     users = [ { user: sys, password: sys_dev_change_me } ]
#   }
# }

# 限制单连接行为，避免误用
max_payload: 4MB
max_pending: 64MB
max_connections: 256

# 写入慢消费者断开阈值
# 2026-04-12: 10s → 30s（启用 per-consumer flow_control 后，server 不应再
# 频繁触发此阈值，30s 仅作为 GC 暂停/IO 尖峰的安全网）
write_deadline: "30s"

# 日志
debug: false
trace: false
logtime: true
