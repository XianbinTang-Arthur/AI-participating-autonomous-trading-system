# =============================================================================
# AATS NATS JetStream — 单节点开发配置
#
# 说明：
#   - 单节点足够开发用；后续如需高可用可改成 3 节点 cluster
#   - JetStream 同时启用 file 和 memory storage；具体每条 stream 用哪种由
#     stream 创建时指定（critical topic 用 file，observer topic 用 memory）
#   - 限额是开发上限，避免单机内存被写爆
# =============================================================================

server_name: aats-nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# JetStream 配置
jetstream {
  store_dir: "/data/jetstream"

  # 文件存储上限：1GB（critical topic 总和）
  max_file_store: 1GB

  # 内存存储上限：256MB（observer topic 总和）
  max_memory_store: 256MB
}

# 系统级账户（可选；用于 NATS 内置监控）
# accounts {
#   $SYS {
#     users = [ { user: sys, password: sys_dev_change_me } ]
#   }
# }

# 限制单连接行为，避免误用
max_payload: 4MB
max_pending: 64MB
max_connections: 256

# 写入慢消费者断开阈值
write_deadline: "10s"

# 日志
debug: false
trace: false
logtime: true
