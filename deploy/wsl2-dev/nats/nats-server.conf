# =============================================================================
# AATS NATS JetStream — 单节点开发配置
#
# 说明：
#   - 单节点足够开发用；后续如需高可用可改成 3 节点 cluster
#   - JetStream 同时启用 file 和 memory storage；具体每条 stream 用哪种由
#     stream 创建时指定（critical topic 用 file，observer topic 用 memory）
#   - 限额是开发上限，避免单机内存被写爆
# =============================================================================

server_name: aats-nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# JetStream 配置
jetstream {
  store_dir: "/data/jetstream"

  # 文件存储上限：8GB（slice nats-capacity §8.1）
  #
  # 容量预算对账（设计文档 §4.1）：
  #   AATS_EVENTS_MARKET.max_bytes  =  2 GB   (短保留 / 高频 snapshots)
  #   AATS_EVENTS.max_bytes         =  4 GB   (长保留 7 天 / critical events)
  #   两条 stream max_bytes 合计     =  6 GB
  #   max_file_store (本字段)        =  8 GB
  #   headroom                      =  2 GB   (25%，留给 index / consumer state /
  #                                           nats server 内部元数据)
  #
  # 病根修复：原值 1 GB 太小，AATS_EVENTS stream 只靠 max_age=7d 软保留，
  # 一次高频写入就撞 server 硬限触发 err_code=10023 "insufficient resources"，
  # publish 永久失败 → event bus 停摆 → 决策链路饿死。现在升到 8 GB +
  # 分层 stream 软刹车（StreamSpec.max_bytes）双重保护。
  #
  # 单元测试 test_total_stream_capacity_within_server_budget 锁死
  # "两条 stream max_bytes 合计 ≤ 6 GB"，防止未来调大 stream 容量时忘记同步
  # 更新本文件导致再次撞硬限。
  max_file_store: 8GB

  # 内存存储上限：256MB（observer topic 总和）
  max_memory_store: 256MB
}

# 系统级账户（可选；用于 NATS 内置监控）
# accounts {
#   $SYS {
#     users = [ { user: sys, password: sys_dev_change_me } ]
#   }
# }

# 限制单连接行为，避免误用
max_payload: 4MB
max_pending: 64MB
max_connections: 256

# 写入慢消费者断开阈值
write_deadline: "10s"

# 日志
debug: false
trace: false
logtime: true
