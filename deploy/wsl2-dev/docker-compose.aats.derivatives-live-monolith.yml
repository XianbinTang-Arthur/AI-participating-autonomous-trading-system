# =============================================================================
# AATS Monolith — OKX 衍生品实盘 override（备用模式）
#
# 单进程 monolith 模式：将 gateway/market/decision/execution 四个 slice
# 合并到同一个进程内运行。
#
# 注意：Stage 4 完成后，4 进程模式已支持 derivatives + hedge。
# 推荐使用 docker-compose.aats.derivatives-live.yml（4 进程模式），
# 本文件仅作为回退备选。4 进程模式下 execution slice 本地构造
# RiskEngine 实例提供 leg_risk_evaluator，无跨进程依赖。
#
# 启动方式（在 deploy/wsl2-dev/ 目录下）：
#   docker compose \
#     -f docker-compose.aats.yml \
#     -f docker-compose.aats.derivatives-live-monolith.yml \
#     --env-file .env.wsl2 \
#     --env-file ../../.env.derivatives.live \
#     up -d
# =============================================================================

name: aats-dev

x-aats-derivatives-live-env: &aats-derivatives-live-env
  AATS_PROFILE: derivatives_live
  AATS_PROCESS_ROLE: monolith

services:
  # monolith 模式：只需要一个容器，替代 4 个独立进程。
  # 使用 api_gateway 入口 + PROCESS_ROLE=monolith，让 build_runtime
  # 装配全部 slice（shared + market + decision + execution + portfolio
  # + reconciliation + startup_recovery）。
  aats-gateway:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
    deploy:
      resources:
        limits:
          memory: 2048M

  # 以下 3 个服务在 monolith 模式下不需要，scale=0 阻止启动。
  aats-market:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
    deploy:
      replicas: 0

  aats-decision:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
    deploy:
      replicas: 0

  aats-execution:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
    deploy:
      replicas: 0

  # rdp-daemon：monolith 模式下同样需要运行，负责执行 data_maintenance / research_cycle。
  aats-rdp-daemon:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
      AATS_PROCESS_ROLE: rdp-daemon
