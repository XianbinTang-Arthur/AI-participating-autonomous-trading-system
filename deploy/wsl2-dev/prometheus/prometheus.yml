# =============================================================================
# Prometheus — AATS 指标采集
#
# 采集 4 个 AATS 进程容器的 PrometheusMetricReader 端点 (:9464/metrics)。
# metrics_bridge.py 定期把 MetricsRegistry 计数器同步到 OTel Counter，
# PrometheusMetricReader 以 Prometheus exposition format 暴露。
#
# 设计文档：docs/task/grafana_audit_fix_design.md §D1
# =============================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # AATS 主进程各自运行 PrometheusMetricReader 在 :9464。目标由 Compose
  # profile 挂载的 file_sd 文件决定：默认是 4 个 sliced 进程，monolith
  # profile 只采集 gateway 容器，防止监控不存在的服务。
  - job_name: aats
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/aats.yml

  # P1-D Phase 1A Stage 4: microstructure WS collector 暴露自己的
  # PrometheusMetricReader 在 :9465（与 9464 错开，避免同主机端口冲突）。
  # Metrics 包括 microstructure_ws_messages_total / bronze_rows_written 等，
  # 对应 Grafana dashboard p1d_microstructure.json Panel 1-2。
  - job_name: aats-microstructure
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/microstructure.yml

  # Redis Exporter — redis_commands_duration_seconds_total 等指标
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          env: dev

  # Prometheus 自采集使服务发现计数进入 TSDB。可选服务告警据此判断当前
  # profile 是否实际配置了对应 target，避免已移除 target 的 up 时序在
  # lookback 窗口内残留并触发误报。
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          env: dev
