# =============================================================================
# AATS 4 进程 — OKX 衍生品实盘 override
#
# 和 docker-compose.aats.derivatives.yml 结构完全对齐，区别：
#   - env_file 指向 .env.derivatives.live（实盘凭证 + 风控参数）
#   - AATS_PROFILE 设为 derivatives_live
#
# 启动方式（在 deploy/wsl2-dev/ 目录下）：
#   docker compose \
#     -f docker-compose.aats.yml \
#     -f docker-compose.aats.derivatives-live.yml \
#     --env-file ../../.env.wsl2 \
#     --env-file ../../.env.derivatives.live \
#     up -d
# =============================================================================

name: aats-dev

x-aats-derivatives-live-env: &aats-derivatives-live-env
  AATS_PROFILE: derivatives_live

services:
  aats-gateway:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-market:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-decision:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-execution:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-rdp-daemon:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
      AATS_PROCESS_ROLE: rdp-daemon

  # ---------------------------------------------------------------------------
  # liquidations-daemon — OKX public `liquidation-orders` WebSocket → staging.raw_liquidations
  # 旁路 data-lake ingest：OKX REST 只保留 7 天强平历史，该 daemon 订阅公共
  # WS 频道长期积累原始事件供未来 baseline contrarian 反转信号回填。不动
  # 主交易路径（market / decision / execution），不写 silver/gold。
  # 复用 aats-base:dev 镜像，不同 entrypoint：scripts/liquidations_ws_daemon.py。
  # ---------------------------------------------------------------------------
  aats-liquidations-daemon:
    build:
      context: ../..
      dockerfile: deploy/wsl2-dev/Dockerfile
    image: aats-base:dev
    container_name: aats-liquidations-daemon
    restart: unless-stopped
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
      AATS_PROCESS_ROLE: liquidations-daemon
      AATS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_EVENT_BUS_BACKEND: hybrid
      AATS_NATS_URL: nats://nats:4222
      AATS_NATS_STREAM_NAME: AATS_EVENTS
      AATS_HOT_STATE_BACKEND: redis
      AATS_HOT_STATE_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_LOG_FORMAT: json
      AATS_LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    # compose_entrypoint shim 先补注入 AATS_STARTUP_PROFILE / AATS_ENV_TEMPLATE_PROFILE
    # 派生变量（managed profile runtime_defaults 合并所需），再 execvp 到 daemon。
    # 不走 shim 会让 AATSSettings 回退到 spot baseline，触发衍生品一致性校验崩。
    command: ["python", "scripts/compose_entrypoint.py", "python", "scripts/liquidations_ws_daemon.py"]
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/aats_liquidations_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_liquidations_heartbeat))) -lt 60",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
