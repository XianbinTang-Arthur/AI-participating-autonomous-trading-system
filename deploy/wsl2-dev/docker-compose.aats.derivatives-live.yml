# =============================================================================
# AATS 4 进程 — OKX 衍生品实盘 override
#
# 和 docker-compose.aats.derivatives.yml 结构完全对齐，区别：
#   - env_file 指向 .env.derivatives.live（实盘凭证 + 风控参数）
#   - AATS_PROFILE 设为 derivatives_live
#
# 启动方式（在 deploy/wsl2-dev/ 目录下）：
#   docker compose \
#     -f docker-compose.aats.yml \
#     -f docker-compose.aats.derivatives-live.yml \
#     --env-file ../../.env.wsl2 \
#     --env-file ../../.env.derivatives.live \
#     up -d
# =============================================================================

name: aats-dev

x-aats-derivatives-live-env: &aats-derivatives-live-env
  AATS_PROFILE: derivatives_live

services:
  aats-gateway:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-market:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-decision:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-execution:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env

  aats-rdp-daemon:
    env_file:
      - ../../.env.derivatives.live
    environment:
      <<: *aats-derivatives-live-env
      AATS_PROCESS_ROLE: rdp-daemon

  # ---------------------------------------------------------------------------
  # liquidations-daemon — OKX public `liquidation-orders` WebSocket → staging.raw_liquidations
  #
  # 旁路 data-lake ingest：OKX REST 只保留 7 天强平历史，该 daemon 订阅公共 WS
  # 频道长期积累原始事件供未来 baseline contrarian 反转信号回填。不动主交易
  # 路径（market / decision / execution），不写 silver/gold。
  #
  # 刻意与主 runtime slice 系统解耦：
  #   - 不注入 AATS_PROCESS_ROLE（不在 4 进程枚举内，走 daemon 里的 model_validate({})
  #     纯默认路径，跳过 managed profile / process_role / derivatives 校验）
  #   - 不加载 .env.derivatives.live（daemon 只用公共 WS，不需要 OKX 凭证）
  #   - 只注入 RDP 库连接（DB 落 staging 是它唯一的外部依赖）
  #
  # 复用 aats-base:dev 镜像，不同 entrypoint：scripts/liquidations_ws_daemon.py。
  # ---------------------------------------------------------------------------
  aats-liquidations-daemon:
    build:
      context: ../..
      dockerfile: deploy/wsl2-dev/Dockerfile
    image: aats-base:dev
    container_name: aats-liquidations-daemon
    restart: unless-stopped
    environment:
      AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_LOG_FORMAT: json
      AATS_LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    command: ["python", "scripts/liquidations_ws_daemon.py"]
    networks:
      - aats
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/aats_liquidations_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_liquidations_heartbeat))) -lt 60",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # microstructure-collector — OKX public microstructure WebSocket 采集
  #
  # 订阅 trades-all / bbo-tbt / books5 / open-interest / funding-rate /
  # mark-price 6 个 public 频道写入 bronze.market_trades /
  # bronze.market_orderbook_bbo / bronze.market_orderbook_books5 /
  # staging.market_oi_funding_ticks。P1-D Phase 1A Stage 2 交付物。
  #
  # 与 aats-liquidations-daemon 同解耦理由（见上方注释）：
  #   - 不注入 AATS_PROCESS_ROLE（不在 4 进程枚举内，走 daemon 的
  #     model_validate({}) 默认路径）
  #   - 不加载 .env.derivatives.live（公共 WS 不需 OKX 凭证）
  #   - 只注入 RDP 库连接；不连 NATS（Q3 决策：不发 NATS 只写 DB）
  #
  # 独立容器换取故障隔离 + 可独立 scale + 对主 snapshot 流零干扰
  # （设计文档附录 C.1 + §2.3 方案 C）。
  # ---------------------------------------------------------------------------
  aats-microstructure-collector:
    build:
      context: ../..
      dockerfile: deploy/wsl2-dev/Dockerfile
    image: aats-base:dev
    container_name: aats-microstructure-collector
    restart: unless-stopped
    environment:
      AATS_ACTIVE_PARAMETER_DB_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      RDP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aats}:${POSTGRES_PASSWORD:-aats}@postgres:5432/aats_research
      AATS_LOG_FORMAT: json
      AATS_LOG_LEVEL: INFO
      # Stage 4 metrics: OTel PrometheusMetricReader 在 :9465,Prometheus
      # 按 target aats-microstructure-collector:9465 采集 (错开 4 个主进程的
      # :9464 端口)。OTel 在容器内跨进程仅用 Meter API,无须 OTLP endpoint。
      # daemon 启动时调用 configure_telemetry + create_bridge,
      # prometheus_client 读此端口 env 在容器内启动 /metrics HTTP 端点。
      OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
      OTEL_EXPORTER_PROMETHEUS_PORT: "9465"
      AATS_OTEL_SERVICE_NAME: aats-microstructure-collector
      AATS_PROCESS_ROLE: microstructure-collector
      TZ: Asia/Shanghai
    command: ["python", "scripts/microstructure_ws_daemon.py"]
    # Stage 4: expose :9465 internally to the compose network so Prometheus
    # can scrape. Not published to host (no `ports:` mapping) — metrics stay
    # inside the docker-network.
    expose:
      - "9465"
    networks:
      - aats
    deploy:
      resources:
        limits:
          # 512M 对齐 liquidations-daemon。稳态 58-250 MB 预估（§9 Day 4），
          # 512M 含 2× headroom 足以覆盖 Bronze buffer 满载 + DB pool。
          memory: 512M
    depends_on:
      aats-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/aats_microstructure_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /tmp/aats_microstructure_heartbeat))) -lt 60",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
