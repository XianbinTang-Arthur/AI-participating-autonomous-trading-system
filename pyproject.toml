[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aats"
version = "0.1.0"
description = "AI Autonomous Trading System reference implementation skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "orjson>=3.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "uvicorn>=0.30",
  "websockets>=13.0",
]

[project.optional-dependencies]
# Stage 4 多进程切片化重构使用：HybridEventBus 的关键 topic 走 NATS JetStream。
# 仅在 AATS_EVENT_BUS_BACKEND=hybrid|nats 时需要安装；in_memory backend 不依赖。
nats = [
  "nats-py>=2.7",
]
# Stage 4 集成测试可选依赖：用 testcontainers 拉真 NATS 容器跑跨进程 round-trip。
# 仅 tests/integration/test_nats_event_bus_roundtrip.py 在 AATS_RUN_NATS_INTEGRATION=1
# 时使用，运行时进程不依赖。安装：pip install -e .[nats-integration]
nats-integration = [
  "nats-py>=2.7",
  "testcontainers>=4.0",
]

[tool.setuptools.packages.find]
include = ["aats*"]
