[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aats"
version = "0.1.0"
description = "AI Autonomous Trading System reference implementation skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "orjson>=3.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.2",
  "pyarrow==25.0.1",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
  "websockets>=13.0",
]

[project.optional-dependencies]
# 常用测试依赖：补齐 pytest-asyncio 插件，以及 NATS 相关单测 import 所需模块。
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "nats-py>=2.7,<3",
]
lint = [
  "ruff==0.15.8",
]
# Isolated PostgreSQL contract tests. These dependencies are part of the
# hash-locked CI/WSL2 test environment, never the runtime image.
postgres-integration = [
  "psycopg2-binary>=2.9,<3",
  "testcontainers[postgres]>=4.14,<5",
]
# Stage 4 多进程切片化重构使用：HybridEventBus 的关键 topic 走 NATS JetStream。
# 仅在 AATS_EVENT_BUS_BACKEND=hybrid|nats 时需要安装；in_memory backend 不依赖。
nats = [
  "nats-py>=2.7",
]
# Stage 4 集成测试可选依赖：用 testcontainers 拉真 NATS 容器跑跨进程 round-trip。
# 仅 tests/integration/test_nats_event_bus_roundtrip.py 在 AATS_RUN_NATS_INTEGRATION=1
# 时使用，运行时进程不依赖。安装：pip install -e .[nats-integration]
nats-integration = [
  "nats-py>=2.7",
  "testcontainers>=4.0",
]
# Stage 6 Redis hot state store：跨进程共享 KV 缓存（kill_switch、portfolio 等）。
# 仅在 AATS_HOT_STATE_BACKEND=redis 时需要安装；默认 memory backend 不依赖。
# 设计文档：docs/task/stage_6_redis_hot_state_design.md
redis = [
  "redis>=5,<6",
]
# Stage 6 集成测试：用 testcontainers 拉真 Redis 容器验证 connect/get/set/expire 端到端。
# 仅 tests/integration/test_hot_state_redis_roundtrip.py 在 AATS_RUN_REDIS_INTEGRATION=1
# 时使用，运行时进程不依赖。安装：pip install -e .[redis-integration]
redis-integration = [
  "redis>=5,<6",
  "testcontainers>=4.0",
]
# Stage 8 OpenTelemetry + Jaeger：4 进程分布式追踪。aats/bootstrap/telemetry.py
# 在未安装时会自动 fallback 到 _NoopTracer，所以只有需要在 docker compose + 4
# 进程真跑里看 trace tree 时才需要装。docker 镜像的 Dockerfile 已经默认装。
# 设计文档：docs/task/stage_8_otel_integration_design.md
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-semantic-conventions>=0.48b0",
  # J-4: Metrics 基础——Prometheus exporter 可被 Grafana 直接抓取
  "opentelemetry-exporter-prometheus>=0.48b0",
]

[tool.setuptools.packages.find]
include = ["aats*"]

[tool.pytest.ini_options]
markers = [
  "asyncio: run an async test through pytest-asyncio",
  "integration: requires an explicitly selected isolated integration environment",
]

[tool.ruff.lint.per-file-ignores]
"scripts/_verify_governance_db.py" = ["E402"]
"scripts/rdp_build_artifact_index.py" = ["E402"]
"scripts/rdp_archive_microstructure.py" = ["E402"]
"scripts/rdp_audit_data_coverage.py" = ["E402"]
"scripts/rdp_import_official_history.py" = ["E402"]
"scripts/rdp_build_source_aware_gold.py" = ["E402"]
"scripts/rdp_download_historical_campaign.py" = ["E402"]
"scripts/rdp_plan_historical_campaign.py" = ["E402"]
"scripts/rdp_run_historical_campaign.py" = ["E402"]
"scripts/rdp_rebuild_historical_bundle.py" = ["E402"]
"scripts/rdp_evaluate_promotion_readiness.py" = ["E402"]
"scripts/rdp_freeze_parameter_set.py" = ["E402"]
"scripts/rdp_list_active_rounds.py" = ["E402"]
"scripts/rdp_retry_failed_round.py" = ["E402"]
"scripts/rdp_run_decision_round.py" = ["E402"]
"scripts/rdp_run_quality_monitor.py" = ["E402"]
"scripts/rdp_select_parameter_upgrade.py" = ["E402"]
"scripts/rdp_update_decision_registry.py" = ["E402"]
"scripts/rdp_validate_artifacts.py" = ["E402"]
"tests/test_review3_fixes.py" = ["E402"]
"tests/test_review_fixes.py" = ["E402"]
"tests/test_step3_research.py" = ["E402"]
"tests/test_taskbook3_acceptance.py" = ["E402"]
"tests/test_taskbook4_acceptance.py" = ["E402"]
