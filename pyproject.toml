[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aats"
version = "0.1.0"
description = "AI Autonomous Trading System reference implementation skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "orjson>=3.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "tenacity>=9.0",
  "uvicorn>=0.30",
  "websockets>=13.0",
]

[tool.setuptools.packages.find]
include = ["aats*"]
